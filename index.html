<title>庫存管理</title>

<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body {
  --ink:#2a2f2b; --soft:#6d766e; --faint:#a4aca5;
  --cream:#f6f3ec; --card:#fff; --rule:#e5e1d6; --hair:#f0ede4;
  --green:#2f4a3a; --green-d:#263d2f; --green-l:#3b5b48;
  --sand:#efe9da; --amber:#c8973a;
  --factory:#1f6b52; --factory-bg:#e8f1ed;
  --store:#a86410; --store-bg:#fbf1df;
  --alert:#b8362c; --alert-bg:#fbeae8;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color:var(--ink); background:var(--cream);
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum";
  min-height:100vh; -webkit-text-size-adjust:100%;
}
button { font-family:inherit; cursor:pointer; }
input, select { font-family:inherit; font-size:16px; color:var(--ink); font-variant-numeric:tabular-nums; }
:focus-visible { outline:2px solid var(--green); outline-offset:1px; border-radius:4px; }
.boot { padding:60px; text-align:center; color:var(--soft); }

/* ---------- 版面 ---------- */
.shell { display:flex; min-height:100vh; }
.side { width:230px; flex:none; background:var(--green); color:#e9efe9;
  display:flex; flex-direction:column; position:sticky; top:0;
  height:100vh; overflow-y:auto; }
.brand { display:flex; align-items:center; gap:11px; padding:20px 18px 22px; }
.brand .mark { width:34px; height:34px; border-radius:9px; background:var(--sand);
  color:var(--green); display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:16px; flex:none; }
.brand .bn { font-size:15px; font-weight:700; color:#fff; letter-spacing:.02em; }
.brand .bs { font-size:11.5px; color:#9db3a4; margin-top:2px; }

.menu { padding:0 12px; display:flex; flex-direction:column; gap:3px; }
.menu button { display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  border:0; background:none; color:#c3d2c7; font-size:14px; padding:11px 13px;
  border-radius:9px; min-height:44px; }
.menu button:hover { background:var(--green-l); color:#fff; }
.menu button.on { background:var(--sand); color:var(--green-d); font-weight:700; }
.menu .ic { font-size:15px; width:18px; text-align:center; }

.sfoot { margin-top:auto; padding:16px 18px 20px; border-top:1px solid rgba(255,255,255,.09); }
.sme { font-size:13px; color:#e9efe9; font-weight:600; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.badge { font-size:10.5px; background:rgba(255,255,255,.14); padding:2px 6px; border-radius:4px; font-weight:500; }
.signout { margin-top:9px; border:1px solid rgba(255,255,255,.2); background:none;
  color:#b9c9bd; font-size:12.5px; padding:6px 12px; border-radius:7px; }
.signout:hover { background:var(--green-l); color:#fff; }

.mainwrap { flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar { background:var(--card); border-bottom:1px solid var(--rule);
  padding:13px 22px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:15; }
.burger { display:none; border:0; background:none; font-size:19px; padding:4px 8px; }
.crumb { display:flex; flex-direction:column; gap:1px; min-width:0; }
.crumb span { font-size:11.5px; color:var(--faint); }
.crumb b { font-size:16px; font-weight:700; }
.sync { margin-left:auto; font-size:11.5px; color:var(--faint); display:flex; align-items:center; gap:6px; }
.dot { width:7px; height:7px; border-radius:50%; }
.dot.ok { background:var(--factory); }
.dot.saving { background:var(--amber); }
.dot.err { background:var(--alert); }
.scrim { display:none; }

.body { padding:20px 22px 60px; max-width:1500px; }

/* ---------- 月份切換與膠囊 ---------- */
.pager { display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:16px; }
.pg { border:1px solid var(--rule); background:var(--card); color:var(--ink);
  padding:8px 15px; border-radius:8px; font-size:13.5px; min-height:40px; }
.pg:hover { background:var(--hair); }
.pgnow { font-size:16px; font-weight:700; min-width:120px; text-align:center; }

.pills { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.pills button { border:1px solid var(--rule); background:var(--card); color:var(--soft);
  padding:8px 18px; border-radius:9px; font-size:13.5px; min-height:40px; }
.pills button.on { background:var(--green); border-color:var(--green); color:#fff; font-weight:700; }
.pills .pill-ghost { margin-left:auto; color:var(--soft); }

/* ---------- 卡片 ---------- */
.card { background:var(--card); border:1px solid var(--rule); border-radius:12px;
  overflow:hidden; margin-bottom:14px; }
.chead { display:flex; align-items:center; gap:10px; padding:14px 16px;
  border-bottom:1px solid var(--hair); cursor:pointer; }
.chead h3 { margin:0; font-size:14.5px; font-weight:700; }
.chead .meta { font-size:12px; color:var(--faint); }
.chead .chev { margin-left:auto; color:var(--faint); font-size:13px; }
.mark-dot { width:8px; height:8px; border-radius:50%; background:var(--factory); flex:none; }
.pad { padding:16px; }

/* ---------- 一般表格 ---------- */
table { width:100%; border-collapse:collapse; font-size:14px; }
th { font-size:11.5px; font-weight:600; color:var(--soft); text-align:right;
  padding:9px 10px; background:#fbfaf6; border-bottom:1px solid var(--rule); white-space:nowrap; }
th.l, td.l { text-align:left; }
td { padding:10px; text-align:right; border-bottom:1px solid var(--hair); white-space:nowrap; }
tbody tr:last-child td { border-bottom:0; }
.f { color:var(--factory); }
.s { color:var(--store); }
.big { font-weight:700; font-size:15px; }
.sub { display:block; font-size:11px; color:var(--faint); margin-top:1px; }
.faint { color:var(--faint); }
.neg { color:var(--alert) !important; font-weight:700; }
.tag { display:inline-block; font-size:11.5px; padding:2px 8px; border-radius:5px; font-weight:600; }
.tag.f { background:var(--factory-bg); color:var(--factory); }
.tag.s { background:var(--store-bg); color:var(--store); }
.tag.admin { background:var(--sand); color:var(--green-d); }
.scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }

/* ---------- 矩陣表：品項當列、日期當欄 ---------- */
.matrix { overflow:auto; max-height:70vh; -webkit-overflow-scrolling:touch; }
.matrix table { border-collapse:separate; border-spacing:0; }
.matrix th, .matrix td { border-bottom:1px solid var(--hair); }
.matrix thead th { position:sticky; top:0; z-index:3; background:#fbfaf6;
  text-align:center; font-size:12px; color:var(--ink); font-weight:700;
  padding:8px 6px; min-width:66px; border-bottom:1px solid var(--rule); }
.matrix thead th span { display:block; font-size:10.5px; color:var(--faint); font-weight:400; margin-top:1px; }
.matrix .stick { position:sticky; left:0; z-index:2; background:#fbfaf6;
  min-width:140px; max-width:140px; text-align:left; font-size:13px;
  font-weight:600; color:var(--ink); padding:8px 12px;
  border-right:1px solid var(--rule); white-space:normal; line-height:1.35; }
.matrix thead .stick { z-index:4; }
.matrix tbody tr:nth-child(odd) .stick { background:#f4f2ea; }
.matrix td { padding:6px 6px; text-align:center; background:var(--card); }
.matrix .todaycol { background:#f2f6f2; }
.matrix thead th.todaycol { background:#e7efe8; color:var(--green); }
.matrix td.badcell { background:var(--alert-bg); }
.cl { font-size:13.5px; line-height:1.5; white-space:nowrap; }
.cl + .cl { border-top:1px dotted var(--hair); margin-top:2px; padding-top:2px; }
.cl b { font-weight:700; }
.cl.f b { color:var(--factory); }
.cl.s b { color:var(--store); }
.cl.neg b { color:var(--alert); }
.cl i { font-style:normal; font-size:10px; margin-right:4px; padding:0 3px;
  border-radius:3px; vertical-align:1px; }
.cl i.out { color:var(--alert); background:var(--alert-bg); }
.cl i.in { color:var(--factory); background:var(--factory-bg); }

/* ---------- 表單 ---------- */
.btn { border:1px solid var(--green); background:var(--green); color:#fff;
  padding:11px 17px; border-radius:9px; font-size:14px; font-weight:600; min-height:44px; }
.btn:hover { background:var(--green-d); }
.btn.ghost { background:none; color:var(--ink); border-color:var(--rule); font-weight:500; }
.btn.ghost:hover { background:var(--hair); }
.btn.danger { background:none; color:var(--alert); border-color:#e6c6c2; }
.btn.mini { padding:7px 13px; min-height:36px; font-size:13px; }
.btn.wide { width:100%; }
.btn:disabled { opacity:.4; }

.seg { display:flex; border:1px solid var(--rule); border-radius:9px; overflow:hidden; background:var(--card); }
.seg button { flex:1; border:0; background:none; padding:10px 6px; font-size:13.5px;
  color:var(--soft); min-height:44px; white-space:nowrap; }
.seg button + button { border-left:1px solid var(--rule); }
.seg button.on { background:var(--green); color:#fff; font-weight:700; }

.fields { display:flex; flex-wrap:wrap; gap:11px; }
.fld { display:flex; flex-direction:column; gap:5px; flex:1 1 140px; min-width:0; }
.fld.full { flex-basis:100%; }
.fld label { font-size:11.5px; color:var(--soft); }
.fld input, .fld select { padding:10px 11px; border:1px solid var(--rule); border-radius:9px;
  background:var(--card); width:100%; min-height:44px; }

.note { font-size:12px; color:var(--soft); line-height:1.7; margin:8px 2px 0; }
.note.warn { color:var(--alert); }
.alertbox { background:var(--alert-bg); border:1px solid #eed3cf; border-radius:11px;
  padding:13px 15px; margin-bottom:14px; }
.alertbox b { font-size:13.5px; }
.alertbox ul { margin:7px 0 0; padding-left:18px; font-size:13px; }
.alertbox li { margin:3px 0; }
.empty { padding:34px 14px; text-align:center; color:var(--soft); font-size:13.5px; }
h2.pg2 { font-size:17px; font-weight:700; margin:0 0 4px; }
p.lede { margin:0 0 15px; font-size:12.5px; color:var(--soft); line-height:1.7; }
h3.sec { font-size:13px; font-weight:700; margin:22px 0 9px; }

/* ---------- 訂單卡 ---------- */
.olist { display:flex; flex-direction:column; }
.ord { padding:14px 16px; border-bottom:1px solid var(--hair); }
.ord:last-child { border-bottom:0; }
.ord .top { display:flex; align-items:center; gap:9px; margin-bottom:6px; }
.ord .date { font-size:17px; font-weight:700; }
.ord .wd { font-size:11.5px; color:var(--faint); }
.ord .cust { font-size:14px; font-weight:600; margin-left:auto; }
.ord .lines { font-size:13.5px; color:var(--soft); line-height:1.75; }
.ord .lines b { color:var(--ink); }
.ord .no { font-size:11.5px; color:var(--faint); margin-top:5px; }
.ord .acts { display:flex; gap:8px; margin-top:10px; }

.tabs { display:flex; gap:18px; border-bottom:1px solid var(--rule); margin-bottom:15px; }
.tabs button { border:0; background:none; padding:9px 0; font-size:14px; color:var(--soft);
  border-bottom:2px solid transparent; margin-bottom:-1px; min-height:42px; }
.tabs button.on { color:var(--green); font-weight:700; border-bottom-color:var(--green); }

.sheet { position:fixed; inset:0; z-index:60; background:var(--cream); display:flex; flex-direction:column; }
.sheet header { background:var(--card); border-bottom:1px solid var(--rule);
  padding:13px 16px; font-weight:700; font-size:15px; }
.sheet .inner { flex:1; overflow:auto; padding:16px; }
.sheet footer { background:var(--card); border-top:1px solid var(--rule);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom)); display:flex; gap:10px; }
.sheet footer .btn { flex:1; }
.row { display:flex; gap:8px; align-items:center; margin-bottom:9px; }
.row select { flex:1; min-width:0; padding:10px; border:1px solid var(--rule);
  border-radius:9px; min-height:44px; background:var(--card); }
.row input { width:92px; padding:10px; border:1px solid var(--rule); border-radius:9px; min-height:44px; }

.toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
  background:var(--green-d); color:#fff; padding:11px 20px; border-radius:9px;
  font-size:13.5px; z-index:90; max-width:88%; text-align:center; }

.gate { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
.gate .box { width:100%; max-width:360px; }
.gate h1 { font-size:21px; font-weight:700; margin:0 0 6px; }
.gate p { font-size:13px; color:var(--soft); line-height:1.7; margin:0 0 18px; }
.gate code { background:var(--sand); padding:1px 5px; border-radius:4px; font-size:12px; }

.tabbar { display:none; }

/* ---------- 手機 ---------- */
@media (max-width:860px) {
  .side { position:fixed; left:0; top:0; z-index:70; transform:translateX(-100%);
    transition:transform .18s ease; height:100vh; }
  .side.open { transform:translateX(0); }
  .scrim { display:block; position:fixed; inset:0; background:rgba(20,30,24,.45); z-index:65; }
  .burger { display:block; }
  .topbar { padding:11px 14px; }
  .body { padding:14px 12px 88px; }
  .pgnow { font-size:15px; min-width:96px; }
  .pg { padding:8px 12px; font-size:13px; }
  .matrix { max-height:64vh; }
  .matrix .stick { min-width:96px; max-width:96px; font-size:12px; padding:7px 8px; }
  .matrix thead th { min-width:60px; font-size:11.5px; }
  .cl { font-size:12.5px; }
  .ord .top { flex-wrap:wrap; }
  .toast { bottom:76px; }
  .tabbar { display:flex; position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:var(--card); border-top:1px solid var(--rule);
    padding-bottom:env(safe-area-inset-bottom); }
  .tabbar button { flex:1; border:0; background:none; padding:8px 2px 9px; font-size:11.5px;
    color:var(--soft); display:flex; flex-direction:column; align-items:center; gap:3px; min-height:54px; }
  .tabbar button.on { color:var(--green); font-weight:700; }
  .tabbar .ic { font-size:16px; line-height:1; }
}

/* ---------- 版本標示 ---------- */
.ver { margin-top:18px; text-align:center; font-size:11.5px; color:var(--faint); }
.sver { margin-top:10px; font-size:11px; color:#8fa595; }

/* ---------- 名字登入頁 ---------- */
.box.login { max-width:420px; background:var(--card); border:1px solid var(--rule);
  border-radius:14px; padding:26px 24px 20px; }
.hint { font-size:12.5px; color:var(--soft); margin:0 0 14px; }
.names { display:flex; flex-wrap:wrap; gap:9px; }
.names button { border:1px solid var(--rule); background:var(--card); color:var(--ink);
  padding:11px 18px; border-radius:9px; font-size:14.5px; min-height:46px; }
.names button:hover { border-color:var(--green); color:var(--green); background:#f4f7f4; }
.picked { display:flex; align-items:center; gap:10px; margin-bottom:14px;
  padding:12px 14px; background:var(--sand); border-radius:9px; }
.picked b { font-size:16px; }
.linky { border:0; background:none; color:var(--soft); font-size:12.5px;
  text-decoration:underline; padding:6px 4px; margin-left:auto; }
.linky.center { display:block; margin:14px auto 0; }



.fld input.pin { font-size:22px; letter-spacing:.4em; text-align:center; padding:12px; }

/* ---------- 桌機：收緊版面，表單不要撐滿整個螢幕 ---------- */
@media (min-width:861px) {
  .body { max-width:1400px; padding:18px 22px 50px; }
  .card { max-width:880px; }
  .card.full { max-width:none; }
  .alertbox { max-width:880px; }
  .pad { padding:14px 16px 16px; }
  .fld { flex:0 1 220px; }
  .fld input, .fld select { min-height:38px; padding:8px 10px; font-size:14px; }
  .fld label { font-size:11px; }
  .btn { padding:9px 16px; min-height:38px; font-size:13.5px; }
  .btn.mini { padding:5px 11px; min-height:31px; font-size:12.5px; }
  .pad .btn.wide, .body > .btn.wide { width:auto; min-width:180px; }
  .seg { max-width:520px; }
  .seg button { min-height:38px; font-size:13px; padding:8px 12px; }
  .body > .seg { max-width:520px; }
  td, th { padding:8px 10px; }
  .chead { padding:12px 16px; }
  .chead h3 { font-size:13.5px; }
  .ord { padding:12px 16px; }
  .note { max-width:880px; }
}

/* ---------- 矩陣左欄的地點標註 ---------- */
.sinner { display:flex; align-items:center; gap:8px; }
.sinner .iname { flex:1; min-width:0; }
.legend { display:flex; flex-direction:column; flex:none; text-align:right; }
.legend .cl { font-size:10.5px; }
.legend .cl b { font-weight:600; }
@media (min-width:861px) {
  .matrix .stick { min-width:178px; max-width:178px; }
}
@media (max-width:860px) {
  .matrix .stick { min-width:124px; max-width:124px; }
  .legend .cl { font-size:9.5px; }
}


/* ---------- 桌機：表單縮成一張窄面板，側欄留著 ---------- */
@media (min-width:861px) {
  .sheet { left:230px; display:block; overflow:auto;
    background:rgba(28,40,32,.24); padding:30px 0 40px 30px; }
  .sheet header, .sheet .inner, .sheet footer {
    width:560px; max-width:100%; background:var(--card); }
  .sheet header { border:1px solid var(--rule); border-bottom:1px solid var(--hair);
    border-radius:12px 12px 0 0; }
  .sheet .inner { border-left:1px solid var(--rule); border-right:1px solid var(--rule);
    overflow:visible; padding:16px; }
  .sheet footer { border:1px solid var(--rule); border-top:1px solid var(--hair);
    border-radius:0 0 12px 12px; padding:12px 16px; }
  .sheet footer .btn { flex:0 0 auto; min-width:120px; }
  .sheet footer { justify-content:flex-end; }
  .sheet .row input { width:84px; }
}

/* ---------- 側欄的外部連結 ---------- */
.extlink { display:flex; align-items:center; gap:11px; padding:11px 13px;
  margin-top:10px; border-top:1px solid rgba(255,255,255,.1); padding-top:16px;
  color:#a9bdae; font-size:14px; text-decoration:none; min-height:44px; }
.extlink:hover { color:#fff; }
.extlink .arrow { margin-left:auto; font-size:11px; opacity:.7; }

/* ---------- 訂單頁工具列 ---------- */
.toolrow { display:flex; gap:10px; align-items:center; margin-bottom:14px; }
.toolrow .btn { min-width:0; }

</style>
</head>
