<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>順道菓子店</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a2f2b; --soft:#6d766e; --cream:#f6f3ec; --card:#fff; --rule:#e5e1d6;
  --green:#2f4a3a; --green-d:#263d2f; --sand:#efe9da; --amber:#c8973a;
  --bar:52px;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* 選擇頁 */
.home{height:100%;overflow:auto;display:grid;padding:32px 20px}
.home-inner{width:min(980px,100%);margin:auto}
.home h1{font-size:clamp(34px,6vw,52px);letter-spacing:.12em;margin:0 0 8px;font-weight:700;color:var(--green)}
.home p.lead{margin:0 0 36px;color:var(--soft);font-size:16px}
.entries{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.entry{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:28px 26px 26px;border:1px solid var(--rule);border-radius:16px;background:var(--card);cursor:pointer;min-height:180px;transition:border-color .15s ease, transform .15s ease}
.entry:hover{border-color:var(--green);transform:translateY(-2px)}
.entry .mark{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--sand);color:var(--green)}
.entry .mark svg{width:22px;height:22px}
.entry h2{margin:6px 0 0;font-size:24px;font-weight:700}
.entry span.desc{color:var(--soft);font-size:15px;line-height:1.6}

/* 切換列 */
.bar{height:var(--bar);display:flex;align-items:center;gap:20px;padding:0 16px 0 20px;background:var(--green);color:#fff}
.bar .brand{border:0;background:none;color:#fff;font-weight:700;font-size:16px;letter-spacing:.08em;cursor:pointer;padding:6px 4px;white-space:nowrap}
.tabs{display:flex;gap:4px;height:100%;align-items:flex-end}
.tab{border:0;background:none;color:#cfdcd3;cursor:pointer;height:calc(100% - 10px);padding:0 18px;border-radius:10px 10px 0 0;font-weight:500;white-space:nowrap}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{background:var(--cream);color:var(--green)}
.views{position:relative;height:calc(100% - var(--bar))}
.views iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--cream)}

/* 常用連結 */
.links{margin-top:40px;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
.links-head{display:flex;align-items:flex-end;gap:10px;margin:0 0 10px}
.links-head h2{margin:0;font-size:20px;font-weight:600;letter-spacing:.2em;color:var(--green)}
.links-head .cake{width:40px;height:auto;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.links ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.links li{border-bottom:1px solid var(--rule)}
.links a{display:flex;align-items:baseline;gap:14px;padding:18px 4px;color:var(--ink);text-decoration:none;font-size:17px;letter-spacing:.08em;transition:color .2s, padding-left .2s}
.links a::before{content:"";width:7px;height:7px;border-radius:50%;background:#6F8455;flex-shrink:0;transform:translateY(-2px)}
.links a:hover{color:#6F8455;padding-left:10px}
.links a small{display:block;margin-top:3px;font-size:12px;letter-spacing:.05em;color:var(--soft)}
@media (prefers-reduced-motion:reduce){.links-head .cake{animation:none}}

@media (max-width:800px){
  .entries{grid-template-columns:1fr}
  .entry{min-height:0}
  .bar{gap:8px;padding:0 8px 0 12px}
  .bar .brand{font-size:14px;letter-spacing:.02em}
  .tab{padding:0 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<section class="home" id="home">
  <div class="home-inner">
    <h1>順道菓子店</h1>
    <p class="lead">選擇要進入的系統</p>
    <div class="entries">
      <button class="entry" type="button" data-go="orders">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="1.5"/><path d="M3 9h18M8 4v17M3 14h18"/></svg></span>
        <h2>出貨表</h2>
        <span class="desc">每天的寄出與店取訂單、禮盒盒數，以及內容物和包材庫存</span>
      </button>
      <button class="entry" type="button" data-go="stock">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 8l9-5 9 5v10l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v10"/></svg></span>
        <h2>門市/工廠撥調</h2>
        <span class="desc">門市與工廠的庫存、訂單、入庫、調撥和盤點</span>
      </button>
      <button class="entry" type="button" data-go="boxes">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="1.5"/><path d="M2 6h20v3H2zM12 6v15"/><path d="M12 6c-1.5-3-5-3.5-5-1.2C7 6 12 6 12 6zM12 6c1.5-3 5-3.5 5-1.2C17 6 12 6 12 6z"/></svg></span>
        <h2>設計部檔期禮盒</h2>
        <span class="desc">檔期禮盒的總數，以及分配給各通路的盒數</span>
      </button>
    </div>
    <section class="links" aria-labelledby="links-title">
      <div class="links-head">
        <h2 id="links-title">常用連結</h2>
        <svg class="cake" viewBox="0 0 56 68" aria-hidden="true">
          <path d="M28 20 C20 18 19 9 23 6.5 C25.5 5 27 6 28 7.5 C29 6 30.5 5 33 6.5 C37 9 36 18 28 20 Z" fill="#D9605B"/>
          <path d="M24 6 L28 9 L32 6 L30 4.5 L28 6.5 L26 4.5 Z" fill="#7F9A5A"/>
          <circle cx="25.5" cy="12" r=".7" fill="#F6D8C4"/><circle cx="30.5" cy="11" r=".7" fill="#F6D8C4"/><circle cx="28" cy="15.5" r=".7" fill="#F6D8C4"/>
          <path d="M6 20 Q28 15 50 20 L50 26 Q46 30 42 26 Q38 30 34 26 Q30 30 26 26 Q22 30 18 26 Q14 30 10 26 Q8 28 6 26 Z" fill="#FFFDF8" stroke="#E6DFD2" stroke-width="1"/>
          <rect x="6" y="26" width="44" height="11" fill="#F1D9A6"/>
          <rect x="6" y="37" width="44" height="6" fill="#FFFDF8"/>
          <circle cx="13" cy="40" r="2.2" fill="#E07A74"/><circle cx="22" cy="40" r="2.2" fill="#E07A74"/><circle cx="31" cy="40" r="2.2" fill="#E07A74"/><circle cx="40" cy="40" r="2.2" fill="#E07A74"/>
          <rect x="6" y="43" width="44" height="13" rx="1" fill="#F1D9A6"/>
          <circle cx="21" cy="48" r="1.6" fill="#3A3632"/><circle cx="35" cy="48" r="1.6" fill="#3A3632"/>
          <path d="M25.5 51 Q28 53.5 30.5 51" stroke="#3A3632" stroke-width="1.3" fill="none" stroke-linecap="round"/>
          <ellipse cx="16" cy="52" rx="2.6" ry="1.5" fill="#E9A39E" opacity=".75"/><ellipse cx="40" cy="52" rx="2.6" ry="1.5" fill="#E9A39E" opacity=".75"/>
          <ellipse cx="28" cy="59" rx="26" ry="3.5" fill="#FFFFFF" stroke="#D8D3C8" stroke-width="1"/>
        </svg>
      </div>
      <ul>
        <li><a href="https://likeadream-transport.vercel.app/dashboard" target="_blank" rel="noopener"><span>運輸轉轉<small>likeadream-transport.vercel.app</small></span></a></li>
        <li><a href="https://yorimichi-schedule.netlify.app/" target="_blank" rel="noopener"><span>班表<small>yorimichi-schedule.netlify.app</small></span></a></li>
        <li><a href="https://docs.google.com/spreadsheets/d/1t6HjTEUbDk4oF-ynYBM2iRf-CUyMVx7VroLqEffe1sI/edit?gid=82900474#gid=82900474" target="_blank" rel="noopener"><span>順道清水-包裝叫貨追蹤表<small>Google 試算表</small></span></a></li>
      </ul>
    </section>
  </div>
</section>

<div id="shell" hidden style="height:100%">
  <nav class="bar" aria-label="系統切換">
    <button class="brand" type="button" data-go="home" title="回選擇頁">順道菓子店</button>
    <div class="tabs" role="tablist">
      <button class="tab" type="button" role="tab" id="tab-orders" data-go="orders" aria-selected="false">出貨表</button>
      <button class="tab" type="button" role="tab" id="tab-stock" data-go="stock" aria-selected="false">門市/工廠撥調</button>
      <button class="tab" type="button" role="tab" id="tab-boxes" data-go="boxes" aria-selected="false">設計部檔期禮盒</button>
    </div>
  </nav>
  <div class="views" id="views"></div>
</div>

<script>
// 兩個系統各自是獨立的網頁，放在分頁裡。第一次點進去才載入，
// 之後切換分頁只是隱藏或顯示，登入狀態和畫面都會保留。
const APPS = {
  orders: { src: "orders.html", title: "出貨表" },
  stock: { src: "stock.html", title: "門市/工廠撥調" },
  boxes: { src: "boxes.html", title: "設計部檔期禮盒" }
};
const frames = {};

function go(key) {
  const home = document.getElementById("home");
  const shell = document.getElementById("shell");
  if (key === "home") {
    shell.hidden = true;
    home.hidden = false;
    document.title = "順道菓子店";
    return;
  }
  const app = APPS[key];
  if (!app) return;
  if (!frames[key]) {
    const f = document.createElement("iframe");
    // 網址後面加上當下時間，瀏覽器就不會拿快取的舊版，每次打開都向伺服器要最新的
    f.src = app.src + "?v=" + Date.now();
    f.title = app.title;
    document.getElementById("views").appendChild(f);
    frames[key] = f;
  }
  for (const k in frames) frames[k].hidden = k !== key;
  for (const k in APPS) document.getElementById("tab-" + k).setAttribute("aria-selected", String(k === key));
  home.hidden = true;
  shell.hidden = false;
  document.title = app.title + "｜順道菓子店";
  frames[key].focus();
}

// 出貨表和門市/工廠撥調共用帳號：出貨表登入或登出後，重新載入已開啟的門市/工廠撥調分頁
window.addEventListener("message", e => {
  if (e.origin !== location.origin || !e.data || e.data.type !== "auth-changed") return;
  const f = frames.stock;
  if (f) f.src = APPS.stock.src + "?v=" + Date.now();
});

document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (b) go(b.dataset.go);
});
</script>
</body>
</html>
