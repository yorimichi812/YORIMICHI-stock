<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出貨表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a2f2b; --soft:#6d766e; --faint:#a4aca5; --cream:#f6f3ec; --card:#fff;
  --rule:#e5e1d6; --grid:#d9d4c7; --grid-strong:#8f8a7c;
  --green:#2f4a3a; --green-d:#263d2f; --green-soft:#e3ece3;
  --white-sec:#ffffff; --green-sec:#eaf1e4;
  --yellow:#fff176; --sun:#fbe3e0; --sun-head:#c0392b;
  --sel:#dbe8fb; --cur:#2f6fd0; --miss:#d93025; --peer:#8a4fd0;
  --alert:#b8362c; --alert-bg:#fbeae8; --amber:#c8973a;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--cream);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:7px;border:1px solid transparent;background:none;cursor:pointer;font-weight:500;white-space:nowrap;font-size:13px}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--green-d)}
.btn.ghost{border-color:#cfc9b9;background:#fff}
.btn.ghost:hover:not(:disabled){border-color:var(--ink)}
.btn.danger{background:var(--alert);color:#fff}
.btn.danger-text{color:var(--alert)}
.btn.link{height:auto;padding:2px 4px;color:var(--green);text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.4;cursor:not-allowed}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=month],select{
  height:34px;border:1px solid #cfc9b9;border-radius:7px;background:#fff;padding:0 9px}
input:focus,select:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px var(--green-soft)}
.lbl{display:block;font-size:12px;color:var(--soft);margin:0 0 5px}
.muted{color:var(--soft)}

/* 登入 */
.gate{min-height:100%;display:grid;place-items:center;padding:24px}
.gate-card{width:min(460px,100%);background:#fff;border:1px solid var(--rule);border-radius:14px;padding:28px}
.gate h1{margin:0 0 18px;font-size:22px;color:var(--green)}
.gate h2{font-size:13px;color:var(--soft);font-weight:500;margin:16px 0 8px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.names button{height:44px;border:1px solid #cfc9b9;border-radius:8px;background:#fff;cursor:pointer;font-weight:500}
.names button:hover{border-color:var(--green);background:var(--green-soft)}
.gate .err{color:var(--alert);font-size:13px;min-height:20px;margin:8px 0}

/* 外框：左側分頁欄、上方工具列、中間內容、下方月份列 */
.app{display:grid;grid-template-columns:128px 1fr;grid-template-rows:auto 1fr auto;height:100%}
.side{grid-row:1 / 4;grid-column:1;background:#fff;border-right:1px solid var(--rule);display:flex;flex-direction:column;padding:14px 8px 12px}
.side h1{font-size:17px;margin:0 8px 14px;color:var(--green);letter-spacing:.06em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{border:0;background:none;padding:9px 12px;border-radius:7px;cursor:pointer;color:var(--soft);font-weight:500;text-align:left;font-size:14px}
.nav button:hover{color:var(--ink);background:#f1eee6}
.nav button.on{background:var(--green);color:#fff}
.nav-sep{border:0;border-top:1px solid var(--rule);margin:8px 4px;width:calc(100% - 8px)}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--rule);display:flex;flex-direction:column;align-items:flex-start;gap:6px;font-size:13px}
.who{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.role{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--green-soft);color:var(--green)}
.top{grid-column:2;display:flex;align-items:center;gap:12px;padding:6px 16px;min-height:44px;background:var(--cream);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.sync{font-size:12px;color:var(--soft);display:flex;align-items:center;gap:6px;margin-left:auto}
.sync i{width:7px;height:7px;border-radius:50%;background:#3E9B6E;display:inline-block}
.sync.bad{color:var(--alert)} .sync.bad i{background:var(--alert)}
.sync[data-rt="off"] i{background:#e0a030}

.bar{grid-column:2;display:flex;align-items:center;gap:8px;padding:6px 16px;border-top:1px solid var(--rule);background:#fff;flex-wrap:wrap}
.months{display:flex;gap:4px;flex-wrap:wrap}
.months button{border:1px solid #cfc9b9;background:#fff;border-radius:7px;padding:4px 10px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums}
.months button.on{background:var(--green);border-color:var(--green);color:#fff}
.months button.now{font-weight:700}
.jump{display:flex;align-items:center;gap:6px;margin-left:6px}
.jump input{height:30px;font-size:13px}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tools .count{font-size:13px;color:var(--soft);margin-right:4px}
.swatch-y{display:inline-block;width:10px;height:10px;background:var(--yellow);border:1px solid #d8c95a;border-radius:2px}

.body{grid-column:2;min-height:0;position:relative}
.scroll{position:absolute;inset:0;overflow:auto}
.page{padding:20px 24px 60px}
.page h2{font-size:18px;margin:0 0 10px}
.page h3{font-size:15px;margin:24px 0 8px}

/* 出貨表 */
.sheet{position:relative;padding:10px 14px 60px;width:max-content}
.week{display:flex;align-items:stretch;margin-bottom:0;border-bottom:3px solid var(--grid-strong)}
.day{border-right:3px solid var(--grid-strong);background:var(--white-sec);display:flex;flex-direction:column}
.week .day:first-child{border-left:3px solid var(--grid-strong)}
.dh{height:26px;display:flex;align-items:center;justify-content:center;font-weight:700;background:#fdf1d6;border-bottom:1px solid var(--grid);font-size:13px}
.day.sun .dh{background:var(--sun-head);color:#fff}
table.t{border-collapse:collapse;table-layout:fixed;font-size:12.5px}
table.t td,table.t th{border:1px dotted var(--grid);height:22px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
table.t th{font-weight:500;font-size:11.5px;color:#4a514b;background:rgba(0,0,0,.025);text-align:center}
table.t td.n{text-align:center;font-variant-numeric:tabular-nums}
table.t td.nm{text-align:left;color:#5b2c8f}
table.t td.kd,table.t td.cd,table.t td.tg,table.t td.lc{text-align:center}
table.t td.lc{font-size:12px}
table.t td.cd{font-size:11.5px}
table.t td.tg{font-size:11.5px}
table.t tr.tot td{border-top:2px solid var(--grid-strong);font-weight:700;background:rgba(0,0,0,.03);color:#333}
table.t tr.tot td.big{color:var(--alert)}
.gsec{background:var(--green-sec);border-top:3px solid var(--grid-strong)}
table.t tr.fill td{background:transparent}
tr.r.packed td{background:var(--yellow)}
td.kd.y{background:var(--yellow)}
tr.r.sel td{box-shadow:inset 0 0 0 999px rgba(47,111,208,.12)}
td.miss{outline:2px solid var(--miss);outline-offset:-2px}
td.csel{box-shadow:inset 0 0 0 999px rgba(47,111,208,.18)}
.palette{position:fixed;z-index:60;background:#fff;border:1px solid #cfc9b9;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;display:grid;grid-template-columns:repeat(4,64px);gap:6px}
.palette button{height:34px;border:1px solid rgba(0,0,0,.12);border-radius:6px;cursor:pointer;font-size:12.5px}
.palette button:hover{outline:2px solid var(--ink)}
.palette .clear{grid-column:1/-1;background:#fff;height:30px}
.swatch-pick input:checked + .sw{outline:2px solid var(--ink);outline-offset:1px;font-weight:700}
.swatch-pick input:focus-visible + .sw{outline:2px solid var(--amber);outline-offset:1px}
td.cur{outline:2px solid var(--cur) !important;outline-offset:-2px;z-index:2}
td[data-peer]{outline:2px solid var(--peer);outline-offset:-2px}
.peer-tag{position:absolute;z-index:15;background:var(--peer);color:#fff;font-size:11px;line-height:15px;padding:0 5px;border-radius:4px 4px 4px 0;font-weight:500;pointer-events:none;white-space:nowrap}
tr.new td{color:var(--faint)}
tr.new td.nm{font-style:italic}
.grip{display:inline-block;width:10px;margin-right:3px;cursor:grab;color:var(--faint);opacity:0;user-select:none}
tr.r:hover .grip{opacity:1}
tr.dropb td{box-shadow:inset 0 2px 0 var(--cur)}
tr.dropa td{box-shadow:inset 0 -2px 0 var(--cur)}
.editor{position:absolute;z-index:20;border:2px solid var(--cur);background:#fff;padding:0 3px;font-size:12.5px;outline:none;border-radius:0}
.editor.armed{opacity:0;pointer-events:none}
.menu{position:absolute;z-index:30;background:#fff;border:1px solid #cfc9b9;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:4px;min-width:90px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 12px;border-radius:5px;cursor:pointer;font-size:13px;white-space:nowrap}
.menu button:hover:not(:disabled),.menu button.hl{background:var(--green-soft)}
.menu button:disabled{color:var(--faint);cursor:not-allowed}
.menu .hint{font-size:11px;color:var(--alert);padding:2px 12px 4px}

/* 庫存表 */
.stock{padding:10px 14px 60px;width:max-content}
table.st{border-collapse:separate;border-spacing:0;font-size:12.5px;table-layout:fixed}
table.st th,table.st td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);height:26px;padding:0 6px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;position:relative}
table.st thead th{background:#fbfaf6;font-weight:500;color:#4a514b;text-align:center;position:sticky;z-index:4}
table.st thead tr:first-child th{top:0;height:26px}
table.st thead tr:nth-child(2) th{top:26px;height:22px;font-size:12px}
table.st thead tr:nth-child(3) th{top:48px;font-size:11.5px}
table.st thead th.wd{font-weight:500}
table.st .name{position:sticky;left:0;z-index:3;text-align:left;background:inherit;min-width:170px;border-right:2px solid var(--grid-strong)}
table.st thead .name{z-index:6;background:#fbfaf6}
table.st .open{border-right:2px solid var(--grid-strong);color:var(--soft)}
table.st th.day-h{border-right:2px solid var(--grid-strong)}
table.st td.rm{border-right:2px solid var(--grid-strong);font-weight:500}
table.st td.mk{color:#1f5a8a}
table.st td.low{background:#f8c9c4 !important;color:#8f1d12}
table.st th.sun{background:var(--sun-head);color:#fff}
table.st th.today{background:#fdf1d6}
table.st tbody tr.r td{background:#fff}
table.st tbody tr.r.z1 td{background:#fbf6e6}
table.st tbody tr.r.z2 td{background:#eef4ea}
table.st tbody tr.r.z3 td{background:#eaf1f8}
table.st tr.subh td{background:#fbfaf6 !important;color:#4a514b;text-align:center;font-size:11.5px;height:22px}
table.st tr.sec td{background:var(--green) !important;color:#fff;font-weight:700;text-align:left;height:28px}
table.st .unit{color:var(--soft);font-size:11px;margin-left:4px}
table.st td.cur{outline:2px solid var(--cur);outline-offset:-2px}

/* 統計、設定、紀錄 */
table.plain{border-collapse:collapse;background:#fff;border:1px solid var(--rule);border-radius:10px;overflow:hidden;min-width:420px}
table.plain th,table.plain td{padding:8px 12px;border-bottom:1px solid #efece3;text-align:left;font-size:13.5px}
table.plain th{background:#fbfaf6;font-weight:500;color:var(--soft);font-size:12.5px}
table.plain td.num{text-align:right;font-variant-numeric:tabular-nums}
table.plain tr.sum td{font-weight:700;border-top:2px solid var(--rule)}
table.plain tr.off td{color:var(--faint)}
/* 設定頁的內容物表：往下捲時標題列固定在上方，欄位不換行 */
table.plain.items{overflow:visible}
table.plain.items th{position:sticky;top:0;z-index:2;box-shadow:0 1px 0 #efece3}
table.plain.items th:first-child{border-top-left-radius:10px}
table.plain.items th:last-child{border-top-right-radius:10px}
table.plain.items th,table.plain.items td{white-space:nowrap}
table.plain.items .ops{flex-wrap:nowrap}
.tag-off{font-size:11px;background:#eee;color:#777;padding:1px 7px;border-radius:999px;margin-left:6px}
.ops{display:flex;gap:2px;flex-wrap:wrap}
.ops button{border:0;background:none;color:var(--green);cursor:pointer;padding:3px 7px;border-radius:5px;font-size:12.5px}
.ops button:hover{background:var(--green-soft)}
.ops button.del{color:var(--alert)}
.ops button:disabled{color:var(--faint);cursor:not-allowed;background:none}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 8px;max-width:900px}
.sec-head h3{margin:0}
.filters{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.empty-note{padding:30px;color:var(--soft);text-align:center;background:#fff;border:1px dashed var(--rule);border-radius:10px;max-width:640px}

/* 對話框 */
.overlay{position:fixed;inset:0;background:rgba(30,35,31,.42);display:grid;place-items:center;padding:20px;z-index:100}
.modal{background:#fff;border-radius:14px;width:min(500px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:20px 22px 18px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modal.wide{width:min(640px,100%)}
.modal h3{margin:0 0 14px;font-size:17px}
.modal.alert h3{color:var(--alert)}
.modal p{margin:0 0 10px;line-height:1.6}
.modal .err{color:var(--alert);font-size:13px;margin:6px 0 0}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.field{margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px}
.mgrid label{display:flex;align-items:center;justify-content:center;gap:4px;border:1px solid #e2ddd0;border-radius:6px;padding:4px 0;font-size:12px;cursor:pointer}
.mgrid label.yr{grid-column:1/-1;border:0;justify-content:flex-start;font-weight:700;padding:6px 0 0;cursor:default}
.radios{display:flex;gap:14px;margin-bottom:6px}
.radios label{display:flex;align-items:center;gap:5px;cursor:pointer}
.bom-row{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid #f0ede5}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:200}

/* 進程表 */
.pg-page{padding-bottom:80px}
.pg-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pg-head h2{margin:0}
.pg-remind{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:#fff7e0;border:1px solid #efd489;border-radius:10px;padding:10px 12px;margin:0 0 12px}
.pg-remind b{margin-right:6px}
.pg-chip{border:1px solid #e0b949;background:#fff;border-radius:999px;padding:3px 10px;cursor:pointer;font-size:13px}
.pg-chip:hover{border-color:var(--ink)}
.pg-table{border-collapse:separate;border-spacing:0;background:#fff;font-size:13px;border-left:1px solid var(--grid);border-top:1px solid var(--grid)}
.pg-table th,.pg-table td{border-right:1px solid var(--grid);border-bottom:1px solid #ebe7dd;padding:3px 8px;white-space:nowrap;height:24px}
.pg-table th{position:sticky;top:0;z-index:3;background:#e8f0f8;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--grid)}
.pg-table .pg-name{position:sticky;left:0;z-index:1;background:#fff;min-width:90px;font-weight:500;text-align:center}
.pg-table th.pg-name{z-index:4;background:#e8f0f8}
.pg-table tr.pg-r2 td{border-bottom:1px solid var(--grid-strong)}
.pg-table td[rowspan]{border-bottom:1px solid var(--grid-strong)}
.pg-table td.pg-date{min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
.pg-table td.pg-auto{color:#4c5a70}
.pg-table td.pg-mark{text-align:center;color:#6b4fb8;font-weight:700}
.pg-table td.pg-today{color:var(--miss);background:#fde0de;font-weight:700}
.pg-table td.pg-note{min-width:160px;max-width:360px;white-space:normal}
.pg-table tr.sel td{box-shadow:inset 0 0 0 999px rgba(47,111,208,.08)}
.pg-table td.pg-newcell{background:#fbfaf6;height:30px}
.pp-add{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;background:#fff;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;margin-bottom:6px}
.pp-handout{background:var(--green-soft);border-radius:9px;padding:10px 14px;margin-bottom:10px;font-size:13px;line-height:1.7}
.pp-handout b{display:block;font-size:14.5px}
.ts-table tr.ts-r td{border-bottom:1px solid var(--grid)}
.ts-table td.ts-menu{text-align:center}

@media (max-width:700px){
  .app{grid-template-columns:96px 1fr}
  .top,.bar{padding:6px 10px}
  .row2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<section class="gate" id="gate" hidden>
  <div class="gate-card">
    <h1>出貨表</h1>
    <div id="gate-body"></div>
  </div>
</section>

<div class="app" id="app" hidden>
  <aside class="side">
    <h1>出貨表</h1>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="who"><span id="who-name"></span><span class="role" id="who-role"></span></div>
      <button class="btn link" type="button" data-a="logout">登出</button>
    </div>
  </aside>
  <header class="top">
    <div class="tools" id="tools"></div>
    <div class="sync" id="sync"><i></i><span id="sync-text">連線中</span></div>
  </header>
  <div class="body"><div class="scroll" id="scroll"><div id="view"></div></div></div>
  <footer class="bar" id="bar" hidden>
    <div class="months" id="months"></div>
    <label class="jump"><span class="muted" style="font-size:12px">跳到</span><input type="month" id="jump"></label>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ============ 跟「門市/工廠撥調」同一個 Supabase 專案，帳號共用 ============ */
const SUPABASE_URL = "https://ogjgxzzymdjyxcdnzuee.supabase.co";
const SUPABASE_KEY = "sb_publishable_bNSESW3KicUfKck1MWXgRw_UpUZJCAO";
/* ======================================================================= */
const PIN_TAIL = "-ld24";            // 與庫存系統相同的密碼補字規則
const POLL_MS = 20000;   // 保險用的完整重新整理（版本號檢查沒啟用時也靠它）
const REV_MS = 3000;     // 每 3 秒檢查一次版本號，有變動才重新抓資料
// 登入只存在這個分頁：關掉分頁或瀏覽器就登出，重新整理不用重登。順便清掉以前存在瀏覽器裡的舊登入。
try { Object.keys(localStorage).forEach(k => { if (k.startsWith("sb-") && k.endsWith("-auth-token")) localStorage.removeItem(k); }); } catch (e) {}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: window.sessionStorage } });

const ROLE_NAME = { admin: "管理者", cs: "客服", packer: "包裝部", kitchen: "內場" };
const VIEWS = [
  { key: "sheet", label: "出貨表", roles: ["admin", "cs", "packer"], main: true },
  { key: "stock", label: "庫存表", roles: ["admin", "cs", "packer", "kitchen"], main: true },
  { key: "progress", label: "進程表", roles: ["admin", "cs"], main: true },
  { key: "tasting", label: "試吃追蹤表", roles: ["admin", "cs"], main: true },
  { key: "stats", label: "月統計", roles: ["admin", "cs", "packer"] },
  { key: "settings", label: "設定", roles: ["admin", "cs"] },
  { key: "logs", label: "紀錄", roles: ["admin", "cs"] },
  { key: "people", label: "人員", roles: ["admin"] }
];
const WD = "日一二三四五六";

  { k: "blue", t: "藍", c: "#cfe2ff" }, { k: "green", t: "綠", c: "#cdeecb" }, { k: "orange", t: "橘", c: "#ffd8b0" }, { k: "pink", t: "粉紅", c: "#ffd1e0" },

/* ---------------- 小工具 ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const fmt = n => (n === null || n === undefined || n === 0) ? "" : Number(n).toLocaleString("zh-TW");
const fmt0 = n => Number(n || 0).toLocaleString("zh-TW");
function addMonths(ym, k) { let [y, m] = ym.split("-").map(Number); m += k; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${pad(m)}`; }
const daysIn = ym => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const dstr = (ym, d) => `${ym}-${pad(d)}`;
const dow = ds => { const [y, m, d] = ds.split("-").map(Number); return new Date(y, m - 1, d).getDay(); };
const md = ds => `${Number(ds.slice(5, 7))}/${Number(ds.slice(8, 10))}`;
const ymLabel = ym => `${ym.slice(0, 4)}年${Number(ym.slice(5))}月`;
const timeFmt = new Intl.DateTimeFormat("zh-TW", { timeZone: "Asia/Taipei", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });
const clockFmt = new Intl.DateTimeFormat("zh-TW", { timeZone: "Asia/Taipei", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
const role = () => S.me && S.me.role;

class Handled extends Error {}

function friendly(m) {
  if (!m) return "發生錯誤，請再試一次。";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "連不上資料庫，請檢查網路後再試一次。";
  if (/JWT|not authenticated|請先登入/i.test(m)) return "登入已過期，請重新登入。";
  if (/duplicate key/i.test(m)) return "名稱重複了，請換一個。";
  return m;
}
async function call(fn, args = {}) {
  let res;
  try { res = await sb.rpc(fn, args); } catch (e) { throw new Error(friendly(e.message)); }
  if (res.error) {
    const m = res.error.message || "";
    if (/JWT expired|invalid JWT|請先登入/.test(m)) { await boot(); throw new Handled(); }
    if (/還沒開通/.test(m)) { await boot(); throw new Handled(); }
    throw new Error(friendly(m));
  }
  return res.data;
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
}

/* ---------------- 對話框 ---------------- */
const openModals = new Set();
function modal({ title, body = "", ok = "確定", cancel = "取消", danger = false, noCancel = false, tone = "", wide = false, onOk, onOpen, extra = [] }) {
  return new Promise(resolve => {
    const last = document.activeElement;
    const w = document.createElement("div"); w.className = "overlay";
    w.innerHTML = `<div class="modal ${tone} ${wide ? "wide" : ""}" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>
      <div class="mb">${body}</div><p class="err" role="alert"></p>
      <div class="acts">${noCancel ? "" : `<button type="button" class="btn ghost" data-x>${esc(cancel)}</button>`}
      ${extra.map((e, i) => `<button type="button" class="btn ghost" data-e="${i}">${esc(e.label)}</button>`).join("")}
      <button type="button" class="btn ${danger ? "danger" : "primary"}" data-ok>${esc(ok)}</button></div></div>`;
    document.body.appendChild(w);
    const okb = $("[data-ok]", w), errEl = $(".err", w);
    const setErr = m => errEl.textContent = m || "";
    let busy = false;
    const close = v => { if (!openModals.has(close)) return; openModals.delete(close); w.remove(); if (last && last.isConnected) last.focus(); resolve(v); };
    openModals.add(close);
    const go = async () => {
      if (busy) return; if (!onOk) return close(true);
      busy = true; okb.disabled = true; setErr("");
      try { const r = await onOk({ root: w, setErr }); if (r !== false) close(r === undefined ? true : r); }
      finally { busy = false; if (w.isConnected) okb.disabled = false; }
    };
    okb.onclick = go;
    const x = $("[data-x]", w); if (x) x.onclick = () => close(null);
    extra.forEach((e, i) => $(`[data-e="${i}"]`, w).onclick = () => close(e.value));
    w.addEventListener("keydown", e => {
      if (w !== [...document.querySelectorAll(".overlay")].pop()) return;
      e.stopPropagation();
      if (e.key === "Escape") { e.preventDefault(); close(noCancel ? true : null); }
      if (e.key === "Enter" && e.target.tagName === "INPUT" && e.target.type !== "checkbox" && e.target.type !== "radio") { e.preventDefault(); go(); }
    });
    if (onOpen) onOpen(w);
    setTimeout(() => (w.querySelector("input:not([type=radio]):not([type=checkbox]),select") || okb).focus(), 0);
  });
}
const closeAll = () => [...openModals].forEach(c => c(null));
const alertBox = (msg, title = "無法完成") => modal({ title, body: `<p>${esc(msg)}</p>`, ok: "知道了", noCancel: true, tone: "alert" });
const confirmBox = (title, msg, ok, danger = false) => modal({ title, body: `<p>${esc(msg)}</p>`, ok, danger });

async function boot() {
  closeAll(); stopSync();
  const { data } = await sb.auth.getSession();
  if (!data.session) return showLogin();
  // 第一次登入要先設定自己的密碼（跟門市/工廠撥調共用同一個標記）
  try {
    const r = await sb.from("app_users").select("must_set_pin").eq("id", data.session.user.id).maybeSingle();
    if (r && r.data && r.data.must_set_pin) return showSetPin(data.session.user.id);
  } catch (e) {}
  let b;
  try {
    const r = await sb.rpc("ship_bootstrap");
    if (r.error) throw new Error(r.error.message);
    b = r.data;
  } catch (e) {
    if (/JWT|請先登入/.test(e.message || "")) { await sb.auth.signOut(); return showLogin(); }
    return showGateMessage(friendly(e.message), true);
  }
  S.me = b.me; S.today = b.today;
  if (!S.me.role) return showGateMessage(`${S.me.name}，你的帳號還沒開通出貨表，請出貨表管理者幫你開通。`, false);
  applyCfg(b);
  if (!S.month) S.month = S.today.slice(0, 7);
  const allowed = VIEWS.filter(v => v.roles.includes(role()));
  if (!allowed.some(v => v.key === S.view)) S.view = allowed[0].key;
  $("#gate").hidden = true; $("#app").hidden = false;
  $("#who-name").textContent = S.me.name; $("#who-role").textContent = ROLE_NAME[role()];
  renderNav();
  startSync();
  await loadData(true);
  if (["admin", "cs"].includes(role())) showNotices();
}

/* ---------------- 同步 ---------------- */
function startSync() {
  stopSync();
  S.channel = sb.channel("ship-live", { config: { broadcast: { self: false }, presence: { key: S.me.id } } });
  S.channel.on("broadcast", { event: "changed" }, () => scheduleRefresh())
    .on("presence", { event: "sync" }, () => {
      const st = S.channel.presenceState(); const map = {};
      for (const k in st) { if (k === S.me.id) continue; for (const p of st[k]) if (p.cell) (map[p.cell] = map[p.cell] || []).push(p.name); }
      S.presenceRt = map; mergePresence();
    })
    .subscribe(status => { S.rt = status; renderSync(); if (status === "SUBSCRIBED") trackPresence(S.cur); });
  S.pingTimer = setInterval(() => pingPresence(), 3000);
  pingPresence();
  S.timer = setInterval(() => refresh(), POLL_MS);
  S.revTimer = setInterval(checkRev, REV_MS);
}
// 問資料庫目前的版本號；跟上次不同就代表有人改了東西
async function checkRev() {
  if (document.hidden || !S.me || !S.me.role || S.revOff) return;
  try {
    const r = await sb.rpc("ship_rev");
    if (r.error) { if (/ship_rev|function/i.test(r.error.message || "")) S.revOff = true; return; }
    if (S.rev !== undefined && r.data !== S.rev) refresh();
    S.revSeen = r.data;
  } catch (e) {}
}
// 名字標籤：透過資料庫回報自己在哪一格、取回別人在哪一格（即時通道沒連上也能用）
let pingT = null;
async function pingPresence() {
  if (!S.me || !S.me.role || S.pingOff || document.hidden) return;
  try {
    const r = await sb.rpc("ship_presence_ping", { p_cell: S.cur || null });
    if (r.error) { if (/ship_presence_ping|function/i.test(r.error.message || "")) S.pingOff = true; return; }
    const map = {};
    for (const p of r.data || []) (map[p.cell] = map[p.cell] || []).push(p.name);
    S.presenceDb = map; mergePresence();
  } catch (e) {}
}
function mergePresence() {
  const out = {};
  for (const src of [S.presenceRt || {}, S.presenceDb || {}])
    for (const k in src) out[k] = [...new Set([...(out[k] || []), ...src[k]])];
  S.presence = out; paintPresence();
}
function stopSync() {
  if (S.pingTimer) clearInterval(S.pingTimer); S.pingTimer = null;
  if (S.timer) clearInterval(S.timer); S.timer = null;
  if (S.revTimer) clearInterval(S.revTimer); S.revTimer = null;
  if (S.channel) sb.removeChannel(S.channel); S.channel = null;
}
function notify() { try { S.channel && S.channel.send({ type: "broadcast", event: "changed", payload: { t: Date.now() } }); } catch (e) {} }
function trackPresence(cell) {
  try { S.channel && S.channel.track({ name: S.me.name, cell }); } catch (e) {}
  clearTimeout(pingT); pingT = setTimeout(pingPresence, 150);   // 換格子時馬上回報一次
}
let rT = null;
function scheduleRefresh() { clearTimeout(rT); rT = setTimeout(() => refresh(), 80); }
let chain = Promise.resolve(), queued = 0;
function refresh() {
  if (queued > 0) return chain;
  queued++;
  chain = chain.then(async () => { queued--; if (S.me && S.me.role) await loadData(false); });
  return chain;
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.me && S.me.role) refresh(); });
function renderSync() {
  $("#sync").classList.toggle("bad", !S.syncOk);
  $("#sync-text").textContent = S.syncOk ? (S.lastSync ? `同步中，${clockFmt.format(S.lastSync)} 更新` : "連線中") : "連線中斷，稍後自動重試";
  $("#sync").title = S.rt === "SUBSCRIBED" ? "即時通道已連線" : "即時通道未連線，改用每 3 秒檢查";
  $("#sync").dataset.rt = S.rt === "SUBSCRIBED" ? "on" : "off";
}

function applyCfg(b) {
  const c = { items: b.items, boxes: b.boxes, tags: b.tags, packs: b.packs, bom: b.bom, item_bom: b.item_bom || [] };
  const j = JSON.stringify(c);
  if (j === S.cfgJson) return false;
  S.cfgJson = j; S.cfg = c; return true;
}

async function loadData(force) {
  try {
    let rev;
    if (!S.revOff) { try { const r = await sb.rpc("ship_rev"); if (!r.error) rev = r.data; } catch (e) {} }
    const month = S.month, view = S.view;
    const [b, o, inv, pg, ts] = await Promise.all([
      call("ship_bootstrap"),
      ["sheet", "stats"].includes(view) ? call("ship_month", { p_month: month + "-01" }) : null,
      view === "stock" ? call("ship_inventory", { p_month: month + "-01" }) : null,
      view === "progress" ? call("ship_progress_list") : null,
      view === "tasting" ? call("ship_tasting_list") : null
    ]);
    if (!b.me.role) return boot();
    if (b.me.role !== S.me.role) { S.me = b.me; return boot(); }
    if (month !== S.month || view !== S.view) return;   // 抓的途中換了月份或分頁，丟掉這次的結果
    S.today = b.today;
    let changed = applyCfg(b) || force;
    if (o) {
      const j = JSON.stringify(o);
      if (j !== S.ordersJson) { S.ordersJson = j; S.orders = o; changed = true; }
    }
    if (inv) {
      const j = JSON.stringify(inv);
      if (j !== S.invJson) { S.invJson = j; S.inv = inv; changed = true; }
    }
    if (pg) {
      const j = JSON.stringify(pg);
      if (j !== PG.json) { PG.json = j; PG.rows = pg; changed = true; }
    }
    if (ts) {
      const j = JSON.stringify(ts);
      if (j !== TS.json) { TS.json = j; TS.rows = ts; changed = true; }
    }
    if (rev !== undefined) S.rev = rev;
    if (S.view === "logs" && force) await loadLogs(true);
    if (S.view === "settings") { const si = await call("ship_stock_items").catch(() => null); if (si && JSON.stringify(si) !== JSON.stringify(S.stockItems)) { S.stockItems = si; changed = true; } }
    if (S.view === "people") { const p = await call("ship_people"); const j = JSON.stringify(p); if (j !== JSON.stringify(S.people) || force) { S.people = p; changed = true; } }
    S.syncOk = true; S.lastSync = new Date();
    if (changed) render();
  } catch (e) {
    if (!(e instanceof Handled)) S.syncOk = false;
  }
  renderSync();
}

  $("#nav").innerHTML = top.map(btn).join("") + (top.length && rest.length ? `<hr class="nav-sep">` : "") + rest.map(btn).join("");

function renderBar() {

      <button class="btn ghost" type="button" data-a="st-packed" ${n ? "" : "disabled"}><span class="swatch-y"></span><span class="swatch-y" style="margin-left:-4px"></span>已包裝</button>

}

/* ---------------- 欄位可見性 ---------------- */
function visibleIn(x, ym) { return (!x.months || x.months.includes(ym)) && (!x.hidden_from || ym < x.hidden_from); }
function monthItems(ym) {
  const used = new Set(); S.orders.forEach(o => Object.keys(o.contents || {}).forEach(k => used.add(Number(k))));
  return S.cfg.items.filter(i => used.has(i.id) || visibleIn(i, ym));
}
function monthBoxes(ym) {

  return S.cfg.boxes.filter(b => used.has(b.id) || visibleIn(b, ym));
}
const cardText = o => o.card_text ? o.card_text : o.card === true ? "○" : o.card === false ? "✕" : "";
const tagName = id => { const t = S.cfg.tags.find(x => x.id === id); return t ? t.name : ""; };

/* =================== 出貨表 =================== */
const LOCN = { store: "門市", factory: "工廠" };
const W = { kd: 38, lc: 44, nm: 128, it: 36, tg: 60, cd: 62, bx: 70 };
function renderSheet() {
  const ym = S.month, n = daysIn(ym);
  const items = monthItems(ym), boxes = monthBoxes(ym);
  const wW = W.kd + W.lc + W.nm + items.length * W.it + W.tg + W.cd;
  const gW = W.nm + boxes.length * W.bx;
  const width = Math.max(wW, gW + 20);
  const byDay = {};
  for (const o of S.orders) (byDay[o.ship_date] = byDay[o.ship_date] || []).push(o);
  const edit = canEdit();
  let html = `<div class="sheet" id="sheet">`;
  for (let start = 1; start <= n; start += 7) {
    const days = []; for (let d = start; d < start + 7 && d <= n; d++) days.push(dstr(ym, d));
    const maxW = Math.max(...days.map(d => (byDay[d] || []).length)) + (edit ? 1 : 0);
    const maxG = Math.max(1, ...days.map(d => (byDay[d] || []).length));
    html += `<div class="week">`;

      html += `<div class="day ${sun ? "sun" : ""}" style="width:${width + 6}px">
        <div class="dh">${Number(d.slice(5, 7))}月${Number(d.slice(8))}日（${WD[dow(d)]}）${sun ? "　只能店取" : ""}</div>`;
      // 白底段
      html += `<table class="t" style="width:${width}px"><colgroup><col style="width:${W.kd}px"><col style="width:${W.lc}px"><col style="width:${W.nm}px">${items.map(() => `<col style="width:${W.it}px">`).join("")}<col style="width:${W.tg}px"><col style="width:${W.cd}px"><col></colgroup>
        <tr><th>寄/取</th><th>門市/工廠</th><th>客人</th>${items.map(i => `<th title="${esc(i.name)}"${i.header_color ? ` style="background:${colorHex(i.header_color)}"` : ""}>${esc(i.code)}</th>`).join("")}<th>吊牌</th><th>卡</th><th></th></tr>`;
      for (const o of white) {
        const k = `w|${o.id}`;
        const packed = o.status === "packed";
        const cs = (f, yellow) => { const own = (o.colors || {})[`w|${f}`]; return own && (!yellow || o.color_keep === true) ? ` style="background:${colorHex(own)}"` : ""; };
        html += `<tr class="r ${o.status === "packed" ? "packed" : ""} ${S.sel.has(o.id) ? "sel" : ""}" data-o="${o.id}" data-d="${d}" data-s="w">
          <td class="kd ${o.status !== "none" ? "y" : ""}" data-k="${k}|kind" data-d="${d}"${cs("kind", o.status !== "none")}>${esc(o.kind || "")}</td>
          <td class="lc" data-k="${k}|loc" data-d="${d}"${cs("loc", packed)}>${esc(LOCN[o.loc] || "")}</td>
          <td class="nm" data-k="${k}|name" data-d="${d}" title="${esc(o.name)}"${cs("name", packed)}>${edit ? `<span class="grip" draggable="true" data-drag="${o.id}">⋮⋮</span>` : ""}${esc(o.name)}</td>
          ${items.map(i => `<td class="n" data-k="${k}|c:${i.id}" data-d="${d}"${cs("c:" + i.id, packed)}>${fmt((o.contents || {})[i.id])}</td>`).join("")}
          <td class="tg" data-k="${k}|tag" data-d="${d}"${cs("tag", packed)}>${esc(tagName(o.tag_id))}</td>

      }

      const sumC = items.map(i => list.reduce((a, o) => a + ((o.contents || {})[i.id] || 0), 0));
      html += `<tr class="tot"><td></td><td></td><td>合計</td>${sumC.map(v => `<td class="n">${fmt(v)}</td>`).join("")}<td></td><td></td><td></td></tr></table>`;
      // 綠底段
      html += `<div class="gsec"><table class="t" style="width:${width}px"><colgroup><col style="width:${W.nm}px">${boxes.map(() => `<col style="width:${W.bx}px">`).join("")}<col></colgroup>
        <tr><th>客人</th>${boxes.map(b => `<th title="${esc(b.name)}">${esc(b.name)}</th>`).join("")}<th></th></tr>`;
      for (const o of green) {

        html += `<tr class="r ${S.sel.has(o.id) ? "sel" : ""}" data-o="${o.id}" data-d="${d}" data-s="g">
          <td class="nm" data-k="${k}|name" data-d="${d}" title="${esc(o.name)}"${cs("name")}>${edit ? `<span class="grip" draggable="true" data-drag="${o.id}">⋮⋮</span>` : ""}${esc(o.name)}</td>

      const totalBoxes = sumB.reduce((a, v) => a + v, 0);
      html += `<tr class="tot"><td class="big">合計 ${fmt0(totalBoxes)} 盒</td>${sumB.map(v => `<td class="n">${fmt(v)}</td>`).join("")}<td></td></tr></table></div>`;
      html += `</div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  if (!S.cfg.items.length && !S.cfg.boxes.length && canEdit()) {
    html = `<div class="page"><div class="empty-note">還沒有內容物和禮盒款式。先到「設定」新增 H、L、A 這些內容物欄位和禮盒款式，出貨表才會有欄位可以填。</div></div>` + html;
  }
  $("#view").innerHTML = html;
  paintCursor(); paintPresence(); paintCells(); placeEditor();
}

/* ---------- 格子定位 ---------- */
function parseKey(k) {
  const [s, o, f] = k.split("|");
  const isNew = o.startsWith("new:");
  return { s, o: isNew ? o : (s === "st" ? o : Number(o)), f, isNew, date: isNew ? o.slice(4) : null };
}
const cellOf = k => document.querySelector(`[data-k="${CSS.escape(k)}"]`) || document.querySelector(`[data-pk="${CSS.escape(k)}"]`);
const orderOf = id => S.orders.find(o => o.id === id);
function paintCursor() {
  document.querySelectorAll("td.cur").forEach(t => t.classList.remove("cur"));
  if (S.cur) { const c = cellOf(S.cur); if (c) c.classList.add("cur"); }
}
function paintPresence() {
  document.querySelectorAll("td[data-peer]").forEach(t => t.removeAttribute("data-peer"));
  document.querySelectorAll(".peer-tag").forEach(t => t.remove());
  const host = $("#scroll"); if (!host) return;
  const hr = host.getBoundingClientRect();
  for (const k in S.presence) {
    const c = cellOf(k); if (!c) continue;
    c.setAttribute("data-peer", "");
    const cr = c.getBoundingClientRect();
    const t = document.createElement("div"); t.className = "peer-tag"; t.textContent = S.presence[k].join("、");
    t.style.left = (cr.left - hr.left + host.scrollLeft) + "px";
    t.style.top = (cr.top - hr.top + host.scrollTop - 15) + "px";
    host.appendChild(t);
  }
}

function orderValue(o, f) {
  if (!o) return null;
  if (f === "name") return o.name;
  if (f === "kind") return o.kind || null;
  if (f === "loc") return o.loc || null;
  if (f === "card") return o.card_text ? o.card_text : (o.card === true || o.card === false) ? o.card : null;
  if (f === "tag") return o.tag_id || null;
  if (f.startsWith("c:")) return (o.contents || {})[f.slice(2)] || null;
  if (f.startsWith("b:")) return (o.boxes || {})[f.slice(2)] || null;
  return null;
}

/* ---------- 選取與游標 ---------- */
async function setCur(k, opts = {}) {
  if (S.cur === k) return;
  const next = parseKey(k);
  if (S.touched && next.o !== S.touched && !opts.skipCheck) {
    const stop = await checkIncomplete();
    if (stop) return;
  }
  S.cur = k; paintCursor(); trackPresence(k);
  const c = cellOf(k); if (c) c.scrollIntoView({ block: "nearest", inline: "nearest" });
  arm(k);
}
// 離開一列時檢查寄／取和小卡。回傳 true 表示已經把游標帶回缺的那格
async function checkIncomplete() {
  const id = S.touched; S.touched = null;
  const o = orderOf(id); if (!o) return false;
  if (true) return false;   // 寄／取和小卡都不用提醒了
  await alertBox(`「${o.name}」還沒選寄／取，請補選。`, "還沒填完");
  const k = `w|${o.id}|kind`;
  S.cur = k; paintCursor(); trackPresence(k);
  const c = cellOf(k); if (c) c.scrollIntoView({ block: "nearest", inline: "nearest" });
  arm(k);
  return true;
}

// 同一天同一段裡，從 a 到 b 的長方形範圍（不含空白新列）
function blockOf(k) { const c = cellOf(k); if (!c) return null; const tr = c.parentElement; return tr.dataset.d + "|" + tr.dataset.s; }
function rectKeys(a, b) {
  const ca = cellOf(a), cb = cellOf(b); if (!ca || !cb || blockOf(a) !== blockOf(b)) return [a];
  const tr = ca.parentElement;
  const rows = [...document.querySelectorAll(`tr.r[data-d="${tr.dataset.d}"][data-s="${tr.dataset.s}"]`)].filter(r => !r.classList.contains("new"));
  const ra = rows.indexOf(ca.parentElement), rb = rows.indexOf(cb.parentElement);
  if (ra < 0 || rb < 0) return [a];
  const c1 = Math.min(ca.cellIndex, cb.cellIndex), c2 = Math.max(ca.cellIndex, cb.cellIndex);
  const out = [];
  for (let i = Math.min(ra, rb); i <= Math.max(ra, rb); i++)
    for (let j = c1; j <= c2; j++) { const td = rows[i].cells[j]; if (td && td.dataset.k) out.push(td.dataset.k); }
  return out;
}
function paintCells() {
  document.querySelectorAll("td.csel").forEach(t => t.classList.remove("csel"));
  if (S.cells.size < 2) return;   // 只選一格時用游標框表示就好
  S.cells.forEach(k => { const c = cellOf(k); if (c) c.classList.add("csel"); });
}
function syncRowsFromCells() {
  S.sel = new Set([...S.cells].map(parseKey).filter(p => typeof p.o === "number" && p.s !== "st").map(p => p.o));
  document.querySelectorAll("tr.r").forEach(tr => tr.classList.toggle("sel", S.sel.has(Number(tr.dataset.o))));
  renderBar();
}

function rowsInSection(d, s) {
  return [...document.querySelectorAll(`tr.r[data-d="${d}"][data-s="${s}"]`)].map(tr => tr.dataset.o);
}
function selectRow(id, e) {
  if (typeof id !== "number") return;
  const o = orderOf(id); if (!o) return;
  if (e && (e.ctrlKey || e.metaKey)) { S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); S.anchor = id; }
  else if (e && e.shiftKey && S.anchor) {
    const a = orderOf(S.anchor);
    if (a && a.ship_date === o.ship_date) {
      const s = parseKey(S.cur || `w|${id}|name`).s === "g" ? "g" : "w";
      const ids = rowsInSection(o.ship_date, s).map(Number).filter(x => !isNaN(x));
      const i1 = ids.indexOf(S.anchor), i2 = ids.indexOf(id);
      if (i1 >= 0 && i2 >= 0) for (let i = Math.min(i1, i2); i <= Math.max(i1, i2); i++) S.sel.add(ids[i]);
    } else S.sel.add(id);
  } else { S.sel = new Set([id]); S.anchor = id; }
  document.querySelectorAll("tr.r").forEach(tr => tr.classList.toggle("sel", S.sel.has(Number(tr.dataset.o))));
  renderBar();
}

/* ---------- 編輯 ---------- */
function editorEl() {
  let e = $("#editor");
  if (!e) {
    e = document.createElement("input"); e.id = "editor"; e.className = "editor"; e.type = "text"; e.autocomplete = "off"; e.hidden = true;
    e.addEventListener("keydown", editorKey);
    e.addEventListener("input", beginTyping);
    e.addEventListener("compositionstart", beginTyping);
    e.addEventListener("blur", () => { if (S.edit && !S.edit.closing && !openModals.size) commitEdit(null); });
    $("#scroll").appendChild(e);
  }
  return e;
}
// 編輯框放在 #scroll 裡，不會因為畫面重畫而消失
function placeEditor() {
  const e = editorEl();
  const k = S.edit ? S.edit.key : S.armed;
  const c = k && cellOf(k);
  if (!c) {
    if (S.edit) { S.edit = null; trackPresence(S.cur); }
    S.armed = null; e.hidden = true; return;
  }
  const host = $("#scroll"), hr = host.getBoundingClientRect(), cr = c.getBoundingClientRect();
  e.style.left = (cr.left - hr.left + host.scrollLeft) + "px"; e.style.top = (cr.top - hr.top + host.scrollTop) + "px";
  e.style.width = Math.max(cr.width, S.edit ? 70 : cr.width) + "px"; e.style.height = cr.height + "px";
  e.classList.toggle("armed", !S.edit);
  e.hidden = false;
  if (document.activeElement !== e && !openModals.size && !$("#menu")) e.focus({ preventScroll: true });
}
// 選到可打字的格子時，先把隱形輸入框放上去，直接打字（包括中文輸入法）就會開始編輯
function arm(k) {
  S.armed = null;
  if (!canEdit() || !k) { placeEditor(); return; }
  const p = parseKey(k);
  const typable = p.s === "st" || p.f === "name" || p.f.startsWith("c:") || p.f.startsWith("b:");
  if (!typable || (p.isNew && p.f !== "name")) { placeEditor(); if (document.activeElement && document.activeElement.id === "editor") document.activeElement.blur(); return; }
  S.armed = k; const e = editorEl(); e.value = ""; placeEditor();
}
function editValue(k) {
  const p = parseKey(k);
  if (p.s === "st") return stockValue(p.o, p.f);
  return p.isNew ? null : orderValue(orderOf(p.o), p.f);
}
function beginTyping() {
  if (S.edit || !S.armed) return;
  const k = S.armed, c = cellOf(k); if (!c) return;
  S.edit = { key: k, old: editValue(k), date: c.dataset.d, typed: true };   // 選好格子直接打字
  S.armed = null; $("#editor").classList.remove("armed");
  placeEditor(); trackPresence(k);
}
function startEdit(k, cardText) {
  if (!canEdit()) return;
  const p = parseKey(k);
  if (p.s !== "st") {
    if (p.isNew && p.f !== "name") return setCur(k.replace(/\|[^|]+$/, "|name"));
    if (["kind", "card", "tag"].includes(p.f) && !(p.f === "card" && cardText)) return openMenu(k);
  }
  const c = cellOf(k); if (!c) return;
  const old = editValue(k);
  S.edit = { key: k, old, date: c.dataset.d }; S.armed = null;
  const e = editorEl();
  e.value = old === null || old === undefined || typeof old === "boolean" ? "" : String(old);
  placeEditor(); e.select();
  trackPresence(k);
}
function editorKey(e) {
  if (S.edit) {
    if (e.isComposing) return;
    const arrow = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" }[e.key];
    // 選好格子直接打字時，方向鍵存檔並跳格；雙擊或按 Enter 進入修改時，方向鍵在文字裡移動游標
    if (arrow && S.edit.typed) { e.preventDefault(); commitEdit(arrow); }
    else if (e.key === "Enter") { e.preventDefault(); commitEdit(e.shiftKey ? "up" : "down"); }
    else if (e.key === "Tab") { e.preventDefault(); commitEdit(e.shiftKey ? "left" : "right"); }
    else if (e.key === "Escape") { e.preventDefault(); cancelEdit(); }
    return;
  }
  const map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
  if (map[e.key]) { e.preventDefault(); moveCursor(map[e.key]); return; }
  if (e.key === "Tab") { e.preventDefault(); moveCursor(e.shiftKey ? "left" : "right"); return; }
  if (e.key === "Enter" || e.key === "F2") { e.preventDefault(); startEdit(S.cur); return; }
  if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); clearCell(S.cur); return; }
}
function cancelEdit() {
  if (!S.edit) return;
  const k = S.edit.key; S.edit.closing = true; S.edit = null; trackPresence(S.cur);
  arm(k);
}
async function commitEdit(move) {
  if (!S.edit || S.edit.closing) return;
  const ed = S.edit; ed.closing = true;
  const raw = $("#editor").value.trim();
  S.edit = null; trackPresence(S.cur);
  const e = $("#editor"); e.value = ""; e.classList.add("armed");
  const p = parseKey(ed.key);
  let ok = true;
  if (p.s === "st") ok = await saveStock(p, ed, raw);
  else if (p.f === "name") ok = await saveName(p, ed, raw);
  else if (p.f === "card") {
    if (raw.length > 20) { await alertBox("小卡的內容最多 20 個字。"); ok = false; }
    else {
      const nv = raw === "" ? null : raw === "○" || raw.toUpperCase() === "O" ? true : raw === "✕" || raw.toUpperCase() === "X" ? false : raw;
      if (nv !== ed.old) ok = await saveField(p.o, "card", ed.old, nv, ed.date);
    }
  }
  else {
    if (raw !== "" && !/^\d+$/.test(raw)) { await alertBox("請輸入 0 以上的整數。"); ok = false; }
    else {
      const nv = raw === "" || Number(raw) === 0 ? null : Number(raw);
      if (nv !== (ed.old || null)) ok = await saveField(p.o, p.f, ed.old || null, nv, ed.date);
    }
  }
  if (ok === "created") { arm(null); return; }
  if (move) moveCursor(move); else if (S.cur) arm(S.cur);
}
async function saveName(p, ed, raw) {
  if (p.isNew) {
    if (!raw) return true;
    try {
      const id = await call("ship_order_create", { p_date: p.date, p_name: raw });
      notify(); await refresh();
      S.touched = id;
      S.cur = `w|${id}|kind`; paintCursor(); trackPresence(S.cur);
    } catch (e) { if (!(e instanceof Handled)) await alertBox(e.message); return false; }

}
// 可以打字編輯的格子
function pgTextCell(f) { return f === "name" || f === "wish" || f === "note" || (f.endsWith(".d") && pgStage(f.slice(0, -2)).manual); }
// 解析輸入的日期：「9/19」自動選離今天最近的那一年；「2027/1/25」直接指定年份
function pgParseDate(raw) {
  const s = raw.trim(); if (!s) return { v: null };
  let m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/), y, mo, d;
  if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else {
    m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})$/); if (!m) return { err: true };
    mo = +m[1]; d = +m[2];
    const ty = Number(S.today.slice(0, 4)), base = Date.UTC(ty, Number(S.today.slice(5, 7)) - 1, Number(S.today.slice(8, 10)));
    let best = null;
    for (const cy of [ty - 1, ty, ty + 1]) { const t = Date.UTC(cy, mo - 1, d); const diff = Math.abs(t - base); if (best === null || diff < best.diff) best = { cy, diff }; }
    y = best.cy;
  }
  const t = new Date(Date.UTC(y, mo - 1, d));
  if (t.getUTCFullYear() !== y || t.getUTCMonth() !== mo - 1 || t.getUTCDate() !== d) return { err: true };
  return { v: t.toISOString().slice(0, 10) };
}

// 今日提醒：日期是今天、還沒完成、沒封存的
function pgReminders() {
  const out = [];
  for (const r of PG.rows) {
    if (r.archived) continue;
    for (const s of PG_STAGES) {
      if (!s.remind || pgDate(r, s.k) !== S.today) continue;
      if (s.done((r.cells || {})[s.k + ".m"])) continue;
      out.push({ id: r.id, name: r.name, stage: s.k, t: s.t });
    }
  }
  return out;
}

function renderProgress() {
  if (PG.edit) { PG.dirty = true; return; }
  const rows = PG.rows.filter(r => !!r.archived === PG.archive);
  const nArch = PG.rows.filter(r => r.archived).length;
  const rem = PG.archive ? [] : pgReminders();
  const grid = [];
  const cell = (r, f, cls, text, extra = "") => {
    const k = pgKey(r.id, f); const col = (r.colors || {})[f];
    return `<td data-pk="${esc(k)}" class="${cls}" ${col ? `style="background:${colorHex(col)}"` : ""} ${extra}>${text}</td>`;
  };
  let body = "";
  rows.forEach(r => {
    const top = ["name", "wish"], bot = ["name", "wish"];
    let t1 = cell(r, "name", "pg-name", esc(r.name), `rowspan="2"`) +
      cell(r, "wish", "pg-date", pgMD(r.wish), `rowspan="2" title="${r.wish || ""}"`);
    let t2 = "";
    PG_STAGES.forEach(s => {
      const d = pgDate(r, s.k);
      t1 += cell(r, s.k + ".d", "pg-date" + (s.before ? " pg-auto" : "") + (d === S.today ? " pg-today" : ""), pgMD(d), `title="${d || ""}"`);
      t2 += cell(r, s.k + ".m", "pg-mark", esc((r.cells || {})[s.k + ".m"] || ""));
      top.push(s.k + ".d"); bot.push(s.k + ".m");
    });
    t1 += cell(r, "note", "pg-note", esc((r.cells || {}).note || ""), `rowspan="2"`);
    top.push("note"); bot.push("note");
    grid.push(top.map(f => pgKey(r.id, f)), bot.map(f => pgKey(r.id, f)));
    body += `<tr class="pg-r1" data-id="${r.id}">${t1}</tr><tr class="pg-r2" data-id="${r.id}">${t2}</tr>`;
  });
  if (!PG.archive) {
    body += `<tr class="pg-new"><td data-pk="p|new|name" class="pg-name pg-newcell" title="打客人名字就會新增"></td><td colspan="${PG_STAGES.length + 2}"></td></tr>`;
    grid.push(["p|new|name"]);
  }
  PG.grid = grid; PG.pos = {};
  grid.forEach((row, ri) => row.forEach((k, ci) => { if (!(k in PG.pos)) PG.pos[k] = [ri, ci]; }));

  $("#view").innerHTML = `<div class="page pg-page">
    <div class="pg-head"><h2>${PG.archive ? "進程表：封存區" : "進程表"}</h2>
      <button class="btn ghost" type="button" data-a="pg-area">${PG.archive ? "回到進程表" : `封存區（${nArch}）`}</button></div>
    ${PG.archive ? `<p class="muted" style="margin:0 0 10px">這裡只顯示已封存的客人，可以直接編輯；選取後按上方的「取消封存」就會回到進程表。</p>` :
      `<div class="pg-remind"><b>今日提醒</b>${rem.length ? rem.map(x => `<button type="button" class="pg-chip" data-a="pg-go" data-id="${x.id}" data-stage="${x.stage}">${esc(x.name)}｜${esc(x.t)}</button>`).join("")
        : `<span class="muted">今天沒有要處理的項目</span>`}</div>`}
    <table class="pg-table"><thead><tr><th class="pg-name">姓名</th><th>希望到貨日</th>${PG_STAGES.map(s => `<th>${esc(s.t)}</th>`).join("")}<th class="pg-note">備註</th></tr></thead>
    <tbody>${body || `<tr><td colspan="${PG_STAGES.length + 3}" class="muted" style="text-align:center;padding:24px">封存區沒有客人</td></tr>`}</tbody></table></div>`;
  if (S.cur && !cellOf(S.cur)) S.cur = null;
  pgPaintSel(); paintCursor(); paintPresence(); pgPlaceEditor();
}
function pgTools() {
  if (!canEdit()) return "";
  const ids = pgSelIds(), n = ids.length;
  return `<span class="count">${n ? `已選 ${n} 位客人` : "點一格選取，Ctrl／Shift 可多選"}</span>
    ${PG.archive ? `<button class="btn ghost" type="button" data-a="pg-unarchive" ${n ? "" : "disabled"}>取消封存</button>`
      : `<button class="btn ghost" type="button" data-a="pg-archive" ${n ? "" : "disabled"}>封存</button>`}
    <button class="btn ghost" type="button" data-a="paint" ${S.cells.size ? "" : "disabled"}><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:linear-gradient(135deg,#cfe2ff 50%,#ffd8b0 50%);border:1px solid rgba(0,0,0,.15)"></span>塗色</button>`;
}
function pgSelIds() { return [...new Set([...S.cells].map(pgParse).map(p => p.id).filter(id => id !== "new"))]; }
function pgPaintSel() {
  document.querySelectorAll(".pg-table td.csel").forEach(t => t.classList.remove("csel"));
  document.querySelectorAll(".pg-table tr.sel").forEach(t => t.classList.remove("sel"));
  if (S.cells.size > 1) S.cells.forEach(k => { const c = cellOf(k); if (c) c.classList.add("csel"); });
  const ids = new Set(pgSelIds());
  document.querySelectorAll(".pg-table tr[data-id]").forEach(tr => tr.classList.toggle("sel", ids.has(Number(tr.dataset.id))));
  $("#tools").innerHTML = pgTools();
}
function pgRect(a, b) {
  const pa = PG.pos[a], pb = PG.pos[b]; if (!pa || !pb) return [b];
  const out = new Set();
  for (let r = Math.min(pa[0], pb[0]); r <= Math.max(pa[0], pb[0]); r++)
    for (let c = Math.min(pa[1], pb[1]); c <= Math.max(pa[1], pb[1]); c++) { const k = (PG.grid[r] || [])[c]; if (k && k !== "p|new|name") out.add(k); }
  return [...out];
}
function pgSetCur(k) {
  S.cur = k; paintCursor(); trackPresence(k);
  const c = cellOf(k); if (c) c.scrollIntoView({ block: "nearest", inline: "nearest" });
  pgPlaceEditor();
}
function pgMove(dir) {
  const p = PG.pos[S.cur]; if (!p) return;
  let [r, c] = p;
  const [dr, dc] = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] }[dir];
  for (let i = 0; i < 4; i++) {   // 姓名、希望到貨日、備註佔兩列，同一格會出現兩次，要多走一步
    r += dr; c += dc;
    if (r < 0 || r >= PG.grid.length) return;
    const row = PG.grid[r];
    if (c < 0 || (dc && c >= row.length)) return;
    const k = row[Math.min(c, row.length - 1)];
    if (k !== S.cur) { S.cells = new Set(k === "p|new|name" ? [] : [k]); PG.anchor = k; pgPaintSel(); return pgSetCur(k); }
  }
}

/* ---------- 編輯框：選到格子時放一個隱形輸入框，直接打字（含中文輸入法）就開始編輯 ---------- */
function pgEditorEl() {
  let e = $("#pg-ed");
  if (!e) {
    e = document.createElement("input"); e.id = "pg-ed"; e.className = "editor armed"; e.type = "text"; e.autocomplete = "off"; e.hidden = true;
    e.addEventListener("keydown", pgEdKey);
    const begin = () => {
      if (PG.edit || !S.cur) return;
      const p = pgParse(S.cur);
      if (!canEdit() || !pgTextCell(p.f)) { e.value = ""; return; }
      PG.edit = { key: S.cur, old: p.id === "new" ? null : pgValue(pgRow(p.id), p.f), typed: true };
      e.classList.remove("armed"); trackPresence(S.cur);
    };
    e.addEventListener("input", begin);
    e.addEventListener("compositionstart", begin);
    e.addEventListener("blur", () => { if (PG.edit && !PG.edit.closing && !openModals.size) pgCommit(null); });
    $("#scroll").appendChild(e);
  }
  return e;
}
function pgPlaceEditor() {
  const e = pgEditorEl();
  const k = PG.edit ? PG.edit.key : S.cur;
  const c = S.view === "progress" && k && cellOf(k);
  if (!c) { e.hidden = true; return; }
  const host = $("#scroll"), hr = host.getBoundingClientRect(), cr = c.getBoundingClientRect();
  e.style.left = (cr.left - hr.left + host.scrollLeft) + "px"; e.style.top = (cr.top - hr.top + host.scrollTop) + "px";
  e.style.width = Math.max(cr.width, PG.edit ? 90 : cr.width) + "px"; e.style.height = Math.min(cr.height, 30) + "px";
  e.classList.toggle("armed", !PG.edit);
  if (!PG.edit) e.value = "";
  e.hidden = false;
  if (document.activeElement !== e && !openModals.size && !$("#pg-menu")) e.focus({ preventScroll: true });
}
function pgStartEdit(k) {
  const p = pgParse(k); if (!canEdit() || !pgTextCell(p.f)) return;
  const r = p.id === "new" ? null : pgRow(p.id);
  const v = r ? pgValue(r, p.f) : null;
  PG.edit = { key: k, old: v };
  const e = pgEditorEl();
  e.value = v === null ? "" : (p.f === "wish" || p.f.endsWith(".d")) ? `${Number(v.slice(5, 7))}/${Number(v.slice(8, 10))}` : v;
  pgPlaceEditor(); e.focus(); e.select(); trackPresence(k);
}
function pgEdKey(e) {
  if (e.isComposing) return;
  const map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
  if (!PG.edit) {
    if (!S.cur) return;
    const p = pgParse(S.cur);
    if (map[e.key]) { e.preventDefault(); return pgMove(map[e.key]); }
    if (e.key === "Tab") { e.preventDefault(); return pgMove(e.shiftKey ? "left" : "right"); }
    if (!canEdit()) { if (e.key.length === 1) e.preventDefault(); return; }
    if (e.key === "Enter" || e.key === "F2") { e.preventDefault(); return p.f.endsWith(".m") ? pgOpenMenu(S.cur) : pgStartEdit(S.cur); }
    if (e.key === "Delete" || e.key === "Backspace") {
      e.preventDefault();
      if (p.f === "name") return pgDeleteNames();
      return pgClear(S.cur);
    }
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && !pgTextCell(p.f)) { e.preventDefault(); if (p.f.endsWith(".m")) pgOpenMenu(S.cur); }
    return;
  }
  // 選好格子直接打字時，方向鍵存檔並跳格；雙擊或按 Enter 進入修改時，方向鍵在文字裡移動游標
  if (map[e.key] && PG.edit.typed) { e.preventDefault(); pgCommit(map[e.key]); }
  else if (e.key === "Enter") { e.preventDefault(); pgCommit("down"); }
  else if (e.key === "Tab") { e.preventDefault(); pgCommit(e.shiftKey ? "left" : "right"); }
  else if (e.key === "Escape") { e.preventDefault(); PG.edit = null; pgAfterEdit(); }
}
function pgAfterEdit() {
  const e = pgEditorEl(); e.value = "";
  trackPresence(S.cur);
  if (PG.dirty) { PG.dirty = false; renderProgress(); } else pgPlaceEditor();
}
async function pgCommit(move) {
  const ed = PG.edit; if (!ed || ed.closing) return;
  ed.closing = true;
  const raw = pgEditorEl().value;
  const p = pgParse(ed.key);
  let nv;
  if (p.f === "wish" || p.f.endsWith(".d")) {
    const d = pgParseDate(raw);
    if (d.err) { PG.edit = null; pgAfterEdit(); await alertBox(`看不懂「${raw.trim()}」這個日期。請打像「9/19」或「2027/1/25」這樣的格式。`); pgPlaceEditor(); return; }
    nv = d.v;
  } else if (p.f === "name") {
    nv = raw.trim();
    if (!nv) { PG.edit = null; pgAfterEdit(); return; }
  } else nv = raw.trim() || null;
  PG.edit = null;
  if (p.id === "new") {
    try {
      const id = await call("ship_progress_create", { p_name: nv });
      notify(); await refresh();
      S.cells = new Set([pgKey(id, "wish")]); PG.anchor = pgKey(id, "wish"); pgPaintSel(); pgSetCur(pgKey(id, "wish"));
    } catch (x) { if (!(x instanceof Handled)) await alertBox(x.message); pgAfterEdit(); }
    return;
  }
  if (nv !== ed.old) await pgSave(p.id, p.f, ed.old, nv);
  pgAfterEdit();
  if (move) pgMove(move);
}
async function pgSave(id, f, oldV, newV) {
  const r = pgRow(id); if (!r) return;
  // 先改畫面，再存
  if (f === "name") r.name = newV; else if (f === "wish") r.wish = newV;
  else { r.cells = { ...(r.cells || {}) }; if (newV === null) delete r.cells[f]; else r.cells[f] = newV; }
  PG.json = ""; renderProgress();
  const show = v => v === null || v === undefined || v === "" ? "空白" : (f === "wish" || f.endsWith(".d")) ? pgMD(v) : v;
  try {
    let res = await call("ship_progress_set", { p_id: id, p_field: f, p_old: oldV, p_new: newV, p_force: false });
    if (res && res.conflict) {
      const force = await modal({
        title: "這格剛被改過", ok: "用我的蓋掉", cancel: "保留對方的",
        body: `<p>「${esc(r.name)}」的這一格剛被 <b>${esc(res.by || "別人")}</b> 改成 <b>${esc(show(res.current))}</b>。</p><p>要用你輸入的 <b>${esc(show(newV))}</b> 蓋掉嗎？</p>`
      });
      if (force) res = await call("ship_progress_set", { p_id: id, p_field: f, p_old: oldV, p_new: newV, p_force: true });
    }
    notify(); await refresh();
  } catch (x) { if (!(x instanceof Handled)) await alertBox(x.message); PG.json = ""; await refresh(); }
}
async function pgClear(k) {
  const p = pgParse(k); if (p.id === "new" || p.f === "name") return;
  if (!p.f.endsWith(".m") && !pgTextCell(p.f)) return;   // 自動日期不能改
  const r = pgRow(p.id); if (!r) return;
  const old = pgValue(r, p.f); if (old === null) return;
  await pgSave(p.id, p.f, old, null);
}

/* ---------- 符號選單 ---------- */
function pgCloseMenu() { const m = $("#pg-menu"); if (m) m.remove(); }
function pgOpenMenu(k) {
  pgCloseMenu();
  const p = pgParse(k); if (!canEdit() || p.id === "new" || !p.f.endsWith(".m")) return;
  const r = pgRow(p.id), s = pgStage(p.f.slice(0, -2)), c = cellOf(k); if (!r || !s || !c) return;
  const cur = pgValue(r, p.f);
  const m = document.createElement("div"); m.id = "pg-menu"; m.className = "menu";
  m.innerHTML = s.marks.map(x => `<button type="button" data-v="${esc(x)}" ${x === cur ? `class="hl"` : ""}>${esc(x)}</button>`).join("") +
    `<div class="hint" style="color:var(--soft)">要清除請按 Delete</div>`;
  const host = $("#scroll"); host.appendChild(m);
  const hr = host.getBoundingClientRect(), cr = c.getBoundingClientRect();
  m.style.left = (cr.left - hr.left + host.scrollLeft) + "px"; m.style.top = (cr.bottom - hr.top + host.scrollTop + 2) + "px";
  m.querySelectorAll("button").forEach(b => b.onclick = async () => {
    pgCloseMenu(); trackPresence(S.cur);
    if (b.dataset.v !== cur) await pgSave(r.id, p.f, cur, b.dataset.v);
    pgPlaceEditor();
  });
  trackPresence(k);
  (m.querySelector("button.hl") || m.querySelector("button")).focus();
  m.addEventListener("keydown", e => {
    const bs = [...m.querySelectorAll("button")]; const i = bs.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); (bs[i + 1] || bs[0]).focus(); }
    if (e.key === "ArrowUp") { e.preventDefault(); (bs[i - 1] || bs[bs.length - 1]).focus(); }
    if (e.key === "Escape") { e.preventDefault(); pgCloseMenu(); trackPresence(S.cur); pgPlaceEditor(); }
    e.stopPropagation();
  });
}

/* ---------- 滑鼠：選格子 ---------- */
document.addEventListener("mousedown", e => {
  if (S.view !== "progress" || !S.me || !S.me.role) return;
  if (e.target.closest("#pg-menu")) return;
  pgCloseMenu();
  if (e.target.id === "pg-ed") return;
  const td = e.target.closest && e.target.closest("td[data-pk]"); if (!td) return;
  e.preventDefault();
  if (PG.edit) pgCommit(null);
  const k = td.dataset.pk, ctrl = e.ctrlKey || e.metaKey;
  if (k === "p|new|name") { S.cells = new Set(); PG.anchor = null; }
  else if (e.shiftKey && PG.anchor) S.cells = new Set([...(ctrl ? S.cells : []), ...pgRect(PG.anchor, k)]);
  else if (ctrl) { S.cells.has(k) ? S.cells.delete(k) : S.cells.add(k); PG.anchor = k; }
  else { S.cells = new Set([k]); PG.anchor = k; }
  PG.click = !ctrl && !e.shiftKey ? k : null;
  pgPaintSel(); pgSetCur(k);
});
document.addEventListener("mouseup", e => {
  if (S.view !== "progress") return;
  const k = PG.click; PG.click = null; if (!k) return;
  const td = e.target.closest && e.target.closest("td[data-pk]");
  if (td && td.dataset.pk === k && k.endsWith(".m") && canEdit()) pgOpenMenu(k);
});
document.addEventListener("dblclick", e => {
  if (S.view !== "progress") return;
  const td = e.target.closest && e.target.closest("td[data-pk]"); if (td) pgStartEdit(td.dataset.pk);
});

/* ---------- 工具列動作 ---------- */
async function pgArchive(v) {
  const ids = pgSelIds(); if (!ids.length) return;
  try { await call("ship_progress_archive", { p_ids: ids, p_archived: v }); S.cells = new Set(); S.cur = null; notify(); PG.json = ""; await refresh(); toast(v ? `已封存 ${ids.length} 位客人` : `已取消封存 ${ids.length} 位客人`); }
  catch (x) { if (!(x instanceof Handled)) await alertBox(x.message); }
}
// 在客人名字格按 Delete：刪除選到的名字格那幾位客人（沒有多選時就是游標那一位）
function pgDeleteNames() {
  const ids = [...new Set([...S.cells, S.cur].filter(Boolean).map(pgParse).filter(p => p.f === "name" && p.id !== "new").map(p => p.id))];
  return pgDelete(ids);
}
async function pgDelete(ids) {
  if (!ids || !ids.length) return;
  const names = ids.map(id => (pgRow(id) || {}).name).filter(Boolean).join("、");
  if (!await confirmBox("刪除客人", `確定要刪除 ${names}？刪除後這些客人的資料就不見了，無法復原。`, "刪除", true)) return;
  try { await call("ship_progress_delete", { p_ids: ids }); S.cells = new Set(); S.cur = null; notify(); PG.json = ""; await refresh(); toast(`已刪除 ${ids.length} 位客人`); }
  catch (x) { if (!(x instanceof Handled)) await alertBox(x.message); }
}
async function pgApplyColor(color) {
  const cells = [...S.cells].map(pgParse).filter(p => p.id !== "new" && pgRow(p.id));
  if (!cells.length) return;
  try { await call("ship_progress_color", { p_cells: cells.map(p => ({ id: p.id, cell: p.f })), p_color: color }); PG.json = ""; notify(); await refresh(); }
  catch (x) { if (!(x instanceof Handled)) await alertBox(x.message); }
}
function pgArea() {
  PG.archive = !PG.archive; S.cells = new Set(); S.cur = null; PG.anchor = null; trackPresence(null);
  $("#scroll").scrollTo(0, 0); renderProgress();
}
function pgGo(id, stage) {
  if (PG.archive) { PG.archive = false; renderProgress(); }
  const k = pgKey(id, stage + ".m");
  S.cells = new Set([k]); PG.anchor = k; pgPaintSel(); pgSetCur(k);
  const c = cellOf(k); if (c) c.scrollIntoView({ block: "center", inline: "center" });
}

/* =================== 試吃追蹤表 =================== */
// 一位客人一列。追蹤日（試吃日 + 5 天）、提醒優惠（試吃日 + 27 天）不存資料庫，在這裡算。
const TS_COLS = [
  { f: "name", t: "姓名", kind: "text" },
  { f: "phone", t: "電話", kind: "text" },
  { f: "date", t: "試吃日", kind: "date" },
  { f: "item", t: "試吃品項", kind: "menu", opts: ["單入", "燒菓子", "兩種", "喜餅"] },
  { f: "pickup", t: "店取/宅配", kind: "menu", opts: ["店取", "宅配"] },
  { f: "follow", t: "追蹤日", kind: "auto", after: 5, check: "tracked" },
  { f: "tracked", t: "已追蹤", kind: "v" },
  { f: "note1", t: "備註", kind: "note" },
  { f: "promo", t: "提醒優惠", kind: "auto", after: 27, check: "reminded" },
  { f: "reminded", t: "已提醒", kind: "v" },
  { f: "note2", t: "備註", kind: "note" }
];
const TS = { rows: [], json: "", archive: false, grid: [], pos: {}, anchor: null, edit: null, dirty: false, click: null };
const tsCol = f => TS_COLS.find(c => c.f === f);
const tsRow = id => TS.rows.find(r => r.id === id);
const tsKey = (id, f) => `t|${id}|${f}`;

      `<div class="pg-remind"><b>今日提醒</b>${rem.length ? rem.map(x => `<button type="button" class="pg-chip" data-a="ts-go" data-id="${x.id}" data-f="${x.f}">${esc(x.name)}｜${esc(x.t)}</button>`).join("")

function tsSelIds() { return [...new Set([...S.cells].map(pgParse).map(p => p.id).filter(id => id !== "new"))]; }

function tsRect(a, b) {

    for (let c = Math.min(pa[1], pb[1]); c <= Math.max(pa[1], pb[1]); c++) { const k = (TS.grid[r] || [])[c]; if (k && k !== "t|new|name") out.push(k); }

/* ---------- 編輯框 ---------- */
function tsEditorEl() {
  let e = $("#ts-ed");
  if (!e) {
    e = document.createElement("input"); e.id = "ts-ed"; e.className = "editor armed"; e.type = "text"; e.autocomplete = "off"; e.hidden = true;
    e.addEventListener("keydown", tsEdKey);

      if (TS.edit || !S.cur) return;

      if (!canEdit() || !tsText(p.f)) { e.value = ""; return; }
      TS.edit = { key: S.cur, old: p.id === "new" ? null : tsValue(tsRow(p.id), p.f), typed: true };
      e.classList.remove("armed"); trackPresence(S.cur);
    };
    e.addEventListener("input", begin);
    e.addEventListener("compositionstart", begin);
    e.addEventListener("blur", () => { if (TS.edit && !TS.edit.closing && !openModals.size) tsCommit(null); });
    $("#scroll").appendChild(e);
  }
  return e;
}
function tsPlaceEditor() {
  const e = tsEditorEl();
  const k = TS.edit ? TS.edit.key : S.cur;
  const c = S.view === "tasting" && k && cellOf(k);
  if (!c) { e.hidden = true; return; }
  const host = $("#scroll"), hr = host.getBoundingClientRect(), cr = c.getBoundingClientRect();
  e.style.left = (cr.left - hr.left + host.scrollLeft) + "px"; e.style.top = (cr.top - hr.top + host.scrollTop) + "px";
  e.style.width = Math.max(cr.width, TS.edit ? 110 : cr.width) + "px"; e.style.height = Math.min(cr.height, 30) + "px";
  e.classList.toggle("armed", !TS.edit);

  TS.edit = { key: k, old: v };
  const e = tsEditorEl();
  e.value = v === null ? "" : p.f === "date" ? `${Number(v.slice(5, 7))}/${Number(v.slice(8, 10))}` : v;

// 選單格、V 格按下去要做的事
function tsActivate(k) {
  const p = pgParse(k); if (!canEdit() || p.id === "new") return;
  const c = tsCol(p.f);
  if (c.kind === "menu") return tsOpenMenu(k);

}

    if (!S.cur) return;

    if (e.key === "Tab") { e.preventDefault(); return tsMove(e.shiftKey ? "left" : "right"); }
    if (!canEdit()) { if (e.key.length === 1) e.preventDefault(); return; }
    if (e.key === "Enter" || e.key === "F2") { e.preventDefault(); return tsText(p.f) ? tsStartEdit(S.cur) : tsActivate(S.cur); }
    if (e.key === "Delete" || e.key === "Backspace") {

}
async function tsCommit(move) {
  const ed = TS.edit; if (!ed || ed.closing) return;
  ed.closing = true;
  const raw = tsEditorEl().value;

/* =================== 庫存表 =================== */
function stockValue(o, f) {
  const [kind, id] = o.split(":"); const d = Number(f.slice(8));
  const rec = S.inv && S.inv[kind === "item" ? "items" : "packs"][id];
  return rec && rec.make[d] ? rec.make[d] : null;
}
function renderStock() {
  const ym = S.month, n = daysIn(ym);
  if (!S.inv) { $("#view").innerHTML = `<div class="page muted">載入中</div>`; return; }
  const today = S.today;
  const active = (list, key) => list.filter(x => {
    const r = S.inv[key][x.id]; if (!r) return false;
    const act = r.open !== 0 || Object.keys(r.make).length || Object.keys(r.use).length;
    return act || visibleIn(x, ym);
  });
  const items = active(S.cfg.items.filter(i => !i.no_stock), "items"), packs = active(S.cfg.packs, "packs");
  const edit = canEdit();
  const head1 = [], headW = [], head2 = [];
  const mo = Number(ym.slice(5));
  for (let d = 1; d <= n; d++) {

  const row = (x, kind, idx) => {
    const r = S.inv[kind === "item" ? "items" : "packs"][x.id];

    for (let d = 1; d <= n; d++) {
      const mk = Number(r.make[d] || 0), us = Number(r.use[d] || 0);

    }
    const label = kind === "item" ? `${esc(x.code)}　${esc(x.name)}` : esc(x.name);
    return `<tr class="r ${["", "z1", "", "z2", "", "z3"][idx % 6]}"><td class="name">${label}<span class="unit">${esc(x.unit)}</span></td><td class="open">${fmt0(r.open)}</td>${cells}</tr>`;
  };
  const w = 170 + 70 + n * 2 * 62;
  $("#view").innerHTML = `<div class="stock">
    <table class="st" style="width:${w}px"><colgroup><col style="width:170px"><col style="width:70px">${"<col style='width:62px'>".repeat(n * 2)}</colgroup>
    <thead><tr><th class="name" rowspan="3">品項</th><th class="open" rowspan="3">月初</th>${head1.join("")}</tr>
      <tr>${headW.join("")}</tr>

    <tbody>
      <tr class="sec"><td class="name">內容物</td><td colspan="${n * 2 + 1}"></td></tr>
      ${items.map((x, i) => row(x, "item", i)).join("") || `<tr><td class="name muted">還沒有內容物</td><td colspan="${n * 2 + 1}"></td></tr>`}
      <tr class="sec"><td class="name">包材</td><td colspan="${n * 2 + 1}"></td></tr>
      <tr class="subh"><td class="name"></td><td class="open"></td>${"<td>進貨</td><td class='rm'>剩餘</td>".repeat(n)}</tr>
      ${packs.map((x, i) => row(x, "pack", i)).join("") || `<tr><td class="name muted">還沒有包材</td><td colspan="${n * 2 + 1}"></td></tr>`}
    </tbody></table></div>`;
  paintCursor(); placeEditor();
}
async function saveStock(p, ed, raw) {
  if (raw !== "" && !/^-?\d+$/.test(raw)) { await alertBox("請輸入整數，校正可以用負數。"); return false; }
  const nv = raw === "" ? 0 : Number(raw);
  const old = Number(ed.old || 0);
  if (nv === old) return true;
  const [kind, id] = p.o.split(":");
  try {
    let r = await call("ship_stock_set", { p_kind: kind, p_ref: Number(id), p_day: p.f, p_old: old, p_new: nv, p_force: false });
    if (r && r.conflict) {
      const force = await modal({ title: "這格剛被改過", ok: "用我的蓋掉", cancel: "保留對方的",
        body: `<p>這一格剛被 <b>${esc(r.by || "別人")}</b> 改成 <b>${esc(r.current)}</b>。</p><p>要用你輸入的 <b>${esc(nv)}</b> 蓋掉嗎？</p>` });
      if (force) await call("ship_stock_set", { p_kind: kind, p_ref: Number(id), p_day: p.f, p_old: old, p_new: nv, p_force: true });
    }
    notify(); await refresh(); return true;
  } catch (e) { if (!(e instanceof Handled)) await alertBox(e.message); return false; }
}

// 月份短寫法：連續的月份合併成一段。同一年「2026年10–12月」，跨年「2026年10月–2027年2月」，不連續用「、」隔開
function monthsText(m) {
  if (!m) return "所有月份";
  if (!m.length) return "";
  const n = x => Number(x.slice(0, 4)) * 12 + Number(x.slice(5)) - 1;
  const ym = v => [Math.floor(v / 12), v % 12 + 1];
  const vals = [...new Set(m.map(n))].sort((a, b) => a - b);
  const runs = [];
  for (const v of vals) { const r = runs[runs.length - 1]; if (r && v === r[1] + 1) r[1] = v; else runs.push([v, v]); }
  return runs.map(([a, b]) => {
    const [ya, ma] = ym(a), [yb, mb] = ym(b);
    if (a === b) return `${ya}年${ma}月`;
    return ya === yb ? `${ya}年${ma}–${mb}月` : `${ya}年${ma}月–${yb}年${mb}月`;
  }).join("、");
}
function hiddenBadge(x) { return x.hidden_from ? `<span class="tag-off">${Number(x.hidden_from.slice(5))}月起下架</span>` : x.hidden ? `<span class="tag-off">已下架</span>` : ""; }
function bomVersions(kind, id) {
  return kind === "item"
    ? S.cfg.item_bom.filter(b => b.item_id === id).sort((a, b) => a.valid_from < b.valid_from ? -1 : 1)
    : S.cfg.bom.filter(b => b.box_id === id).sort((a, b) => a.valid_from < b.valid_from ? -1 : 1);
}
function bomText(id, kind = "box") {
  const vs = bomVersions(kind, id);
  if (!vs.length) return `<span class="muted">未設定</span>`;
  const v = vs[vs.length - 1];
  const txt = (v.lines || []).map(l => { const p = S.cfg.packs.find(x => x.id === l.pack); return p ? `${p.name}×${Number(l.qty)}` : ""; }).filter(Boolean).join("、") || "無";
  return esc(txt) + (v.valid_from > "1900-01-01" ? `<span class="muted">（${md(v.valid_from)} 起）</span>` : "");
}

function swatchPicker(name, cur) {

// yearsAhead 有給的話，只顯示今年起算的幾年（引導式新增禮盒用：今年、明年）
function monthPicker(sel, yearsAhead) {
  const now = S.today.slice(0, 7); const y0 = Number(now.slice(0, 4));
  const set = new Set(sel || []);
  const years = yearsAhead ? Array.from({ length: yearsAhead }, (_, i) => y0 + i) : [y0 - 1, y0, y0 + 1, y0 + 2];
  let html = "";
  for (const y of years) {

  }
  return html;
}
