    }
    if (WZ.step < 7) { wzMove(1); return wizRender(); }
    t.disabled = true;
    try {
      await call("ship_box_wizard", { p: {
        box: { name: WZ.name, months: WZ.allMonths ? null : WZ.months },
        new_packs: WZ.newPacks.map(p => ({ tmp: p.tmp, name: p.name, unit: p.unit, safety: p.safety })),
        // 不計庫存的代號不會出現在庫存表，全名直接用綠底禮盒名稱
        new_items: WZ.newItems.map(it => ({ code: it.code, name: it.stock ? it.name : WZ.name, unit: it.stock ? it.unit : "", safety: it.stock ? it.safety : 0, no_stock: !it.stock, header_color: it.hc || null, all_months: WZ.allMonths || it.allMonths, bom: it.stock ? cleanLines(it.bom) : [] })),
        extend_items: [...WZ.extend],
        box_bom: cleanLines(WZ.boxBom)
      } });
      const name = WZ.name;
      [...openModals].pop()();
      notify(); await refresh(); toast(`已新增「${name}」`);
    } catch (x) { if (!(x instanceof Handled)) err.textContent = x.message; t.disabled = false; }
    return;
  }
  if (a === "back") { wzMove(-1); return wizRender(); }
  if (a === "additem") WZ.newItems.push({ code: "", hc: null, stock: null, name: "", unit: "", safety: 0, allMonths: false, bom: [] });
  if (a === "rmitem") WZ.newItems.splice(Number(t.dataset.i), 1);
  if (a === "addline" || a === "rmline") {
    const key = t.dataset.list; const list = key === "box" ? WZ.boxBom : WZ.newItems[Number(key.slice(5))].bom;
    if (a === "addline") list.push({ pack: "", qty: "" }); else list.splice(Number(t.dataset.i), 1);
  }
  wizRender();
}

/* =================== 紀錄 =================== */
function logsShell() {
  const f = S.logs.f;
  return `<div class="page" id="log-shell" style="max-width:1200px"><h2>操作紀錄</h2>
    <div class="filters">
      <div><label class="lbl" for="lf-from">開始日期</label><input type="date" id="lf-from" value="${esc(f.from)}"></div>
      <div><label class="lbl" for="lf-to">結束日期</label><input type="date" id="lf-to" value="${esc(f.to)}"></div>
      <div><label class="lbl" for="lf-actor">操作人員</label><select id="lf-actor" style="min-width:130px"></select></div>
      <div><label class="lbl" for="lf-cust">客人名字</label><input type="text" id="lf-cust" value="${esc(f.customer)}" placeholder="輸入部分名字"></div>
      <button class="btn ghost" type="button" data-a="clear-logs">清除篩選</button>
    </div>
    <table class="plain" style="width:100%"><thead><tr><th>時間</th><th>人員</th><th>動作</th><th>日期</th><th>客人</th><th>內容</th></tr></thead><tbody id="log-rows"></tbody></table>
    <div style="text-align:center;padding:14px" id="log-more" hidden><button class="btn ghost" type="button" data-a="more-logs">載入更早的紀錄</button></div></div>`;
}
function renderLogRows() {
  const sel = $("#lf-actor");
  if (sel) { const v = S.logs.f.actor; sel.innerHTML = `<option value="">全部</option>` + S.logs.actors.map(a => `<option ${a === v ? "selected" : ""}>${esc(a)}</option>`).join(""); }
  const tb = $("#log-rows"); if (!tb) return;
  tb.innerHTML = S.logs.rows.length ? S.logs.rows.map(r => `<tr><td style="white-space:nowrap" class="muted">${timeFmt.format(new Date(r.at))}</td><td>${esc(r.actor_name)}</td>
    <td style="white-space:nowrap">${esc(r.action)}</td><td>${r.order_date ? md(r.order_date) : ""}</td><td>${esc(r.customer || "")}</td><td>${esc(r.detail || "")}</td></tr>`).join("")
    : `<tr><td colspan="6" class="muted" style="text-align:center;padding:28px">沒有符合條件的紀錄</td></tr>`;
  $("#log-more").hidden = S.logs.done;
}
async function loadLogs(reset) {
  const f = S.logs.f; const seq = ++S.logs.seq;
  if (f.from && f.to && f.from > f.to) { S.logs.rows = []; S.logs.done = true; renderLogRows(); return; }
  const off = reset ? 0 : S.logs.rows.length;
  const d = await call("ship_logs_query", { p_from: f.from || null, p_to: f.to || null, p_actor: f.actor || null, p_customer: f.customer || null, p_limit: 200, p_offset: off });
  if (seq !== S.logs.seq) return;
  S.logs.actors = d.actors; S.logs.rows = reset ? d.rows : S.logs.rows.concat(d.rows); S.logs.done = d.rows.length < 200;
  renderLogRows();
}
let custT = null;
document.addEventListener("input", e => {
  if (e.target.id === "lf-cust") { S.logs.f.customer = e.target.value.trim(); clearTimeout(custT); custT = setTimeout(() => loadLogs(true).catch(() => {}), 350); }
});
document.addEventListener("change", e => {
  const f = S.logs.f;
  if (e.target.id === "lf-from") { f.from = e.target.value; loadLogs(true).catch(() => {}); }
  if (e.target.id === "lf-to") { f.to = e.target.value; loadLogs(true).catch(() => {}); }
  if (e.target.id === "lf-actor") { f.actor = e.target.value; loadLogs(true).catch(() => {}); }
  if (e.target.id === "jump" && e.target.value) goMonth(e.target.value);
  if (e.target.dataset && e.target.dataset.roleFor) setRole(e.target.dataset.roleFor, e.target.value, e.target);
  if (e.target.dataset && e.target.dataset.appFor) setAppRole(e.target.dataset.appFor, e.target.value);
});

/* =================== 人員 =================== */
const SHIP_ROLES = [["", "不開通"], ["admin", "管理者"], ["cs", "客服"], ["packer", "包裝部"], ["kitchen", "內場"]];
const APP_ROLES = [["staff", "一般"], ["admin", "管理者"], ["none", "不開通"]];
function renderPeople() {
  const opts = (list, cur) => list.map(([v, t]) => `<option value="${v}" ${(cur || "") === v ? "selected" : ""}>${t}</option>`).join("");
  const ho = S.handout;
  return `<div class="page"><h2>人員</h2>
    <p class="muted">帳號跟「門市/工廠撥調」共用，這裡新增、改名、重設密碼、停用或刪除，撥調那邊也會一起生效。<br>
    出貨表角色　管理者：全部功能＋管理人員　客服：KEY 單、標示狀態、設定、製作進貨、進程表、試吃追蹤表　包裝部：只能看出貨表和庫存表　內場：只能看庫存表</p>
    <h3>新增人員</h3>
    ${ho ? `<div class="pp-handout"><b>已建立 ${esc(ho.name)}，臨時密碼：${esc(ho.pin)}</b>請把這組密碼告訴本人。他第一次登入後，系統會要求他自己設一組新的。
      <button class="btn link" type="button" data-a="pp-handout-close">知道了</button></div>` : ""}
    <div class="pp-add">
      <div><label class="lbl" for="np-name">姓名</label><input type="text" id="np-name" maxlength="20"></div>
      <div><label class="lbl" for="np-pin">臨時密碼（至少 4 碼）</label><input type="text" id="np-pin" maxlength="20" autocomplete="off"></div>
      <div><label class="lbl" for="np-app">撥調身分</label><select id="np-app">${opts(APP_ROLES, "staff")}</select></div>
      <div><label class="lbl" for="np-ship">出貨表角色</label><select id="np-ship">${opts(SHIP_ROLES, "")}</select></div>
      <button class="btn primary" type="button" data-a="pp-add">新增</button>
    </div>
    <h3>人員名單</h3>
    <table class="plain"><tr><th>姓名</th><th>撥調身分</th><th>出貨表角色</th><th>狀態</th><th></th></tr>
    ${S.people.map(p => { const me = p.id === S.me.id; return `<tr class="${p.active ? "" : "off"}">
      <td style="white-space:nowrap">${esc(p.name)}${me ? `<span class="muted" style="font-size:12px;margin-left:6px">你</span>` : ""}</td>
      <td><select data-app-for="${p.id}">${opts(APP_ROLES, p.app_role)}</select></td>
      <td><select data-role-for="${p.id}">${opts(SHIP_ROLES, p.role)}</select></td>
      <td style="white-space:nowrap">${p.active ? "啟用中" : `<span class="tag-off">已停用</span>`}</td>
      <td style="white-space:nowrap"><button class="btn link" type="button" data-a="pp-rename" data-id="${p.id}">改姓名</button>
        <button class="btn link" type="button" data-a="pp-pin" data-id="${p.id}">重設密碼</button>
        ${me ? "" : `<button class="btn link" type="button" data-a="pp-toggle" data-id="${p.id}">${p.active ? "停用" : "啟用"}</button>
        <button class="btn link danger-text" type="button" data-a="pp-del" data-id="${p.id}">刪除</button>`}</td></tr>`; }).join("")}</table></div>`;
}
const personOf = id => S.people.find(p => p.id === id);
const shipRoleName = r => (SHIP_ROLES.find(x => x[0] === (r || "")) || [, "不開通"])[1];
const appRoleName = r => (APP_ROLES.find(x => x[0] === r) || [, r])[1];
async function reloadPeople() { S.people = await call("ship_people").catch(() => S.people); render(); }
async function peopleLog(detail) { try { await call("ship_people_log", { p_detail: detail }); } catch (e) {} }
// 直接改 app_users（跟撥調系統一樣）。沒有權限時資料庫不會報錯、只是改不到，所以要檢查有沒有真的改到
async function updateAppUser(id, patch) {
  const r = await sb.from("app_users").update(patch).eq("id", id).select("id");
  if (r.error) throw new Error(friendly(r.error.message));
  if (!r.data || !r.data.length) throw new Error("改不了。只有同時是「門市/工廠撥調」管理者的人才能做這個動作。");
}
async function rpcOrThrow(fn, args) {
  const r = await sb.rpc(fn, args);
  if (r.error) throw new Error(friendly(r.error.message));
  return r.data;
}
function promptBox(title, label, value = "", hint = "") {
  return modal({
    title, ok: "確定",
    body: `<div class="field"><label class="lbl" for="pb-in">${esc(label)}</label><input type="text" id="pb-in" maxlength="20" value="${esc(value)}" style="width:100%" autocomplete="off"></div>${hint ? `<p class="muted" style="font-size:12.5px">${esc(hint)}</p>` : ""}`,
    onOpen: root => { const i = $("#pb-in", root); i.focus(); i.select(); },
    onOk: ({ root }) => $("#pb-in", root).value.trim()
  });
}
async function peopleAction(act, btn) {
  try {
    if (act === "pp-handout-close") { S.handout = null; return render(); }
    if (act === "pp-add") {
      const name = $("#np-name").value.trim(), pin = $("#np-pin").value, app = $("#np-app").value, ship = $("#np-ship").value;
      if (!name) return alertBox("請填姓名。");
      if (pin.length < 4) return alertBox("臨時密碼至少 4 碼。");
      btn.disabled = true;
      const id = await rpcOrThrow("create_staff", { p_name: name, p_pin: pin, p_role: app });
      if (ship) await call("ship_role_set", { p_user: id, p_role: ship });
      await peopleLog(`新增人員「${name}」（撥調：${appRoleName(app)}，出貨表：${shipRoleName(ship)}）`);
      S.handout = { name, pin }; notify(); return reloadPeople();
    }
    const p = personOf(btn.dataset.id); if (!p) return;
    if (act === "pp-rename") {
      const nv = await promptBox(`改 ${p.name} 的姓名`, "姓名", p.name); if (!nv || nv === p.name) return;
      await updateAppUser(p.id, { name: nv });
      await peopleLog(`改姓名：${p.name} → ${nv}`); toast("已改姓名");
    } else if (act === "pp-pin") {
      const np = await promptBox(`重設 ${p.name} 的密碼`, "臨時密碼（至少 4 碼）", "", "他下次登入時，系統會要求他自己再設一組新的。"); if (!np) return;
      if (np.length < 4) return alertBox("臨時密碼至少 4 碼。");
      await rpcOrThrow("set_staff_pin", { p_user: p.id, p_pin: np });
      await peopleLog(`重設「${p.name}」的密碼`);
      await alertBox(`${p.name} 的臨時密碼是：${np}。請轉告本人，他下次登入時要自己再設一組新的。`, "已重設密碼");
    } else if (act === "pp-toggle") {
      await updateAppUser(p.id, { active: !p.active });
      await peopleLog(`${p.active ? "停用" : "啟用"}「${p.name}」`); toast(p.active ? `已停用 ${p.name}` : `已啟用 ${p.name}`);
    } else if (act === "pp-del") {
      if (!await confirmBox("刪除人員", `確定要刪除 ${p.name}？他就再也不能登入出貨表和撥調系統了。他之前做過的紀錄會保留，上面的名字也還在。`, "刪除", true)) return;
      await rpcOrThrow("delete_staff", { p_user: p.id });
      await peopleLog(`刪除人員「${p.name}」`); toast(`已刪除 ${p.name}`);
    }
    notify(); await reloadPeople();
  } catch (e) { if (btn) btn.disabled = false; if (!(e instanceof Handled)) await alertBox(e.message); await reloadPeople(); }
}
async function setAppRole(uid, r) {
  const p = personOf(uid); if (!p) return;
  try { await updateAppUser(uid, { role: r }); await peopleLog(`改撥調身分：${p.name} ${appRoleName(p.app_role)} → ${appRoleName(r)}`); toast("撥調身分已更新"); notify(); }
  catch (e) { await alertBox(e.message); }
  await reloadPeople();
}
async function setRole(uid, r, el) {
  try { await call("ship_role_set", { p_user: uid, p_role: r || null }); toast("角色已更新"); notify(); if (uid === S.me.id) return boot(); await refresh(); }
  catch (e) { if (!(e instanceof Handled)) await alertBox(e.message); S.people = await call("ship_people").catch(() => S.people); render(); }
}

/* =================== 切換 =================== */
async function goMonth(ym) {
  if (S.touched && await checkIncomplete()) return;
  if (S.edit) await commitEdit(null);
  S.month = ym; S.cur = null; S.armed = null; S.cells = new Set(); trackPresence(null); S.sel.clear(); S.ordersJson = ""; S.invJson = ""; S.inv = null; S.orders = [];
  renderBar(); $("#view").innerHTML = `<div class="page muted">載入中</div>`;
  $("#scroll").scrollTo(0, 0);
  await loadData(true);
}
async function goView(v) {
  if (S.touched && await checkIncomplete()) return;
  if (S.edit) await commitEdit(null);
  if (PG.edit) await pgCommit(null);
  if (TS.edit) await tsCommit(null);
  S.view = v; S.cur = null; S.cells = new Set(); closeMenu(); pgCloseMenu(); tsCloseMenu(); trackPresence(null); pgPlaceEditor(); tsPlaceEditor();
  $("#view").innerHTML = `<div class="page muted">載入中</div>`;
  $("#scroll").scrollTo(0, 0);
  renderNav(); renderBar();
  S.armed = null; placeEditor();
  await loadData(true);
}
document.addEventListener("click", e => {
  const v = e.target.closest("[data-view]"); if (v) return goView(v.dataset.view);
  const m = e.target.closest("[data-month]"); if (m) return goMonth(m.dataset.month);
  const s = e.target.closest("[data-set]"); if (s) return settingAction(s);
  const a = e.target.closest("[data-a]"); if (!a) return;
  const act = a.dataset.a;
  if (act === "logout") return logout();
  if (act.startsWith("pp-")) return peopleAction(act, a);
  if (act === "st-packed") return setStatus("packed");
  if (act === "st-none") return setStatus("none");
  if (act === "move") return moveDate();
  if (act === "paint") return openPalette(a, S.view === "progress" ? pgApplyColor : S.view === "tasting" ? tsApplyColor : applyColor);
  if (act === "ts-archive") return tsArchive(true);
  if (act === "ts-unarchive") return tsArchive(false);
  if (act === "ts-area") return tsArea();
  if (act === "ts-go") return tsGo(Number(a.dataset.id), a.dataset.f);
  if (act === "pg-archive") return pgArchive(true);
  if (act === "pg-unarchive") return pgArchive(false);
  if (act === "pg-area") return pgArea();
  if (act === "pg-go") return pgGo(Number(a.dataset.id), a.dataset.stage);
  if (act === "more-logs") return loadLogs(false).catch(() => {});
  if (act === "clear-logs") { S.logs.f = { from: "", to: "", actor: "", customer: "" }; $("#view").innerHTML = logsShell(); return loadLogs(true).catch(() => {}); }
});
window.addEventListener("beforeunload", e => {
  const o = S.touched && orderOf(S.touched);
  // 不再因為沒選寄／取而提醒
});
// 選單和輸入框都放在捲動區裡，會跟著內容一起捲動，不需要在捲動時關掉
$("#scroll").addEventListener("scroll", () => { if (S.edit) placeEditor(); }, { passive: true });

boot();
</script>
