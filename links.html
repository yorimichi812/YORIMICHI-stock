<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>順道菓子店 常用連結</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2F1EC;
    --ink: #3A3632;
    --soft: #8A847B;
    --matcha: #6F8455;
    --azuki: #8E4A45;
    --line: #D8D3C8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }
  .wrap {
    display: flex;
    flex-direction: row-reverse;
    align-items: flex-start;
    gap: 56px;
    width: 100%;
    max-width: 560px;
  }
  .brand {
    writing-mode: vertical-rl;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    flex-shrink: 0;
  }
  .brand h1 {
    margin: 0;
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: 0.35em;
  }
  .brand p {
    margin: 0;
    font-size: 0.85rem;
    letter-spacing: 0.3em;
    color: var(--soft);
  }
  .hanko {
    writing-mode: horizontal-tb;
    width: 34px;
    height: 34px;
    border: 2px solid var(--azuki);
    border-radius: 4px;
    color: var(--azuki);
    font-size: 0.72rem;
    line-height: 1.05;
    display: grid;
    place-items: center;
    text-align: center;
    margin-top: 6px;
  }
  .cake {
    writing-mode: horizontal-tb;
    width: 52px;
    height: auto;
    margin-top: 10px;
    transform-origin: 50% 100%;
    animation: sway 4s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .cake { animation: none; }
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    flex: 1;
    border-top: 1px solid var(--line);
  }
  li { border-bottom: 1px solid var(--line); }
  a {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 22px 4px;
    color: var(--ink);
    text-decoration: none;
    font-size: 1.15rem;
    letter-spacing: 0.08em;
    transition: color .2s, padding-left .2s;
  }
  a::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--matcha);
    flex-shrink: 0;
    transform: translateY(-2px);
  }
  a:hover { color: var(--matcha); padding-left: 10px; }
  a:focus-visible { outline: 2px solid var(--matcha); outline-offset: 4px; }
  a small {
    display: block;
    margin-top: 4px;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    color: var(--soft);
  }
  @media (max-width: 520px) {
    .wrap { gap: 28px; }
    .brand h1 { font-size: 1.6rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    a { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <h1>順道菓子店</h1>
    <p>常用連結</p>
    <div class="hanko">順道</div>
    <svg class="cake" viewBox="0 0 56 68" aria-hidden="true">
      <!-- strawberry -->
      <path d="M28 20 C20 18 19 9 23 6.5 C25.5 5 27 6 28 7.5 C29 6 30.5 5 33 6.5 C37 9 36 18 28 20 Z" fill="#D9605B"/>
      <path d="M24 6 L28 9 L32 6 L30 4.5 L28 6.5 L26 4.5 Z" fill="#7F9A5A"/>
      <circle cx="25.5" cy="12" r=".7" fill="#F6D8C4"/>
      <circle cx="30.5" cy="11" r=".7" fill="#F6D8C4"/>
      <circle cx="28" cy="15.5" r=".7" fill="#F6D8C4"/>
      <!-- top cream -->
      <path d="M6 20 Q28 15 50 20 L50 26 Q46 30 42 26 Q38 30 34 26 Q30 30 26 26 Q22 30 18 26 Q14 30 10 26 Q8 28 6 26 Z" fill="#FFFDF8" stroke="#E6DFD2" stroke-width="1"/>
      <!-- sponge top -->
      <rect x="6" y="26" width="44" height="11" fill="#F1D9A6"/>
      <!-- cream + strawberry layer -->
      <rect x="6" y="37" width="44" height="6" fill="#FFFDF8"/>
      <circle cx="13" cy="40" r="2.2" fill="#E07A74"/>
      <circle cx="22" cy="40" r="2.2" fill="#E07A74"/>
      <circle cx="31" cy="40" r="2.2" fill="#E07A74"/>
      <circle cx="40" cy="40" r="2.2" fill="#E07A74"/>
      <!-- sponge bottom -->
      <rect x="6" y="43" width="44" height="13" rx="1" fill="#F1D9A6"/>
      <!-- face -->
      <circle cx="21" cy="48" r="1.6" fill="#3A3632"/>
      <circle cx="35" cy="48" r="1.6" fill="#3A3632"/>
      <path d="M25.5 51 Q28 53.5 30.5 51" stroke="#3A3632" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <ellipse cx="16" cy="52" rx="2.6" ry="1.5" fill="#E9A39E" opacity=".75"/>
      <ellipse cx="40" cy="52" rx="2.6" ry="1.5" fill="#E9A39E" opacity=".75"/>
      <!-- plate -->
      <ellipse cx="28" cy="59" rx="26" ry="3.5" fill="#FFFFFF" stroke="#D8D3C8" stroke-width="1"/>
    </svg>
  </header>
  <ul>
    <li>
      <a href="https://likeadream-transport.vercel.app/dashboard" target="_blank" rel="noopener">
        <span>運輸轉轉<small>likeadream-transport.vercel.app</small></span>
      </a>
    </li>
    <li>
      <a href="https://yorimichi-schedule.netlify.app/" target="_blank" rel="noopener">
        <span>班表<small>yorimichi-schedule.netlify.app</small></span>
      </a>
    </li>
    <li>
      <a href="https://docs.google.com/spreadsheets/d/1t6HjTEUbDk4oF-ynYBM2iRf-CUyMVx7VroLqEffe1sI/edit?gid=82900474#gid=82900474" target="_blank" rel="noopener">
        <span>順道清水-包裝叫貨追蹤表<small>Google 試算表</small></span>
      </a>
    </li>
  </ul>
</div>
</body>
</html>
